# MinIO (standalone) — kind worker(pep-worker)의 /mnt/disks/minio(=Windows 폴더)를
# 로컬 PV 로 사용. NodePort 30900/30901 는 kind extraPortMappings 로 Windows 에 노출.
#
#   kubectl apply -f manifests/minio.yaml
#   kubectl -n minio rollout status deploy/minio
#
# 접속 (Windows):
#   - API     : http://localhost:30900
#   - Console : http://localhost:30901   (minioadmin / minioadmin — 데모용)
---
apiVersion: v1
kind: Namespace
metadata:
  name: minio
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-minio
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio-pv
spec:
  capacity:
    storage: 9Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-minio
  local:
    path: /mnt/disks/minio/data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["pep-worker"]      # kind 노드명: <cluster>-worker
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: minio
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-minio
  resources:
    requests:
      storage: 9Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: minio
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
  labels: { app: minio }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      nodeSelector:
        kubernetes.io/hostname: pep-worker
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - secretRef: { name: minio-creds }
          ports:
            - { containerPort: 9000, name: api }
            - { containerPort: 9001, name: console }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
spec:
  type: NodePort
  selector: { app: minio }
  ports:
    - { name: api,     port: 9000, targetPort: 9000, nodePort: 30900 }
    - { name: console, port: 9001, targetPort: 9001, nodePort: 30901 }
