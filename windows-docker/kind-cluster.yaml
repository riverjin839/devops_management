# kind (Kubernetes IN Docker) — Windows / Docker Desktop 용 PEP 테스트 클러스터.
#
#   kind create cluster --name pep --config kind-cluster.yaml
#
# Mac 의 vagrant 경로와 "동일 패턴":
#   - control-plane + worker (worker 에 MinIO 디스크/워크로드)
#   - kube-API 를 host 에 노출 → PEP(docker-compose)가 host.docker.internal:6443 으로 접속
#   - apiserver 인증서 SAN 에 host.docker.internal 포함 (TLS 검증 정상)
#   - MinIO NodePort(30900/30901) 를 host 로 포워딩
#
# 차이(Docker/kind 한계):
#   - 노드가 컨테이너라 "실디스크"는 없음 → Windows 폴더를 extraMounts 로 마운트해 대체
#   - 노드에 sshd 가 없음 → Host Facts(SSH) 는 별도 node-ssh 컨테이너로 테스트(README 참고)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pep
networking:
  # 0.0.0.0 으로 바인딩해야 host.docker.internal 로 도달 가능. (kubeconfig server 는
  # 클라이언트에 맞게 127.0.0.1 / host.docker.internal 로 바꿔 사용 — README 참고.)
  apiServerAddress: "0.0.0.0"
  apiServerPort: 6443
  # 기본 CNI(kindnet)로 바로 Ready. Mac 가이드처럼 Cilium+Hubble 까지 테스트하려면
  # 아래 줄 주석을 풀고 클러스터 생성 후 `cilium install` 한다(WIN_LOCAL_TEST_GUIDE 참고).
  # disableDefaultCNI: true
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          certSANs:
            - host.docker.internal
            - localhost
            - 127.0.0.1
  - role: worker
    # MinIO 용 "디스크" 대체: Windows 폴더 → 노드 /mnt/disks/minio 로 마운트.
    # 사전: Windows 에서 C:\pep-kind\minio 폴더 생성 + Docker Desktop 파일 공유 허용.
    extraMounts:
      - hostPath: C:/pep-kind/minio
        containerPath: /mnt/disks/minio
    # MinIO NodePort 를 Windows 호스트로 노출.
    extraPortMappings:
      - { containerPort: 30900, hostPort: 30900, protocol: TCP }
      - { containerPort: 30901, hostPort: 30901, protocol: TCP }
