services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: k8s_monitor_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: k8s_monitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: k8s_monitor_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    networks:
      - default
      - kind
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: k8s_monitor_backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/k8s_monitor
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ansible:/app/ansible:ro

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: k8s_monitor_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  # Celery Worker
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: k8s_monitor_celery
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      - DEBUG=true
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/k8s_monitor
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ansible:/app/ansible:ro

  # LLM 전용 워커 — 알람 자동 분석(llm 큐)만 소비. 기본 워커와 격리해
  # LLM 대기(120s+)가 점검/배치잡을 밀어내지 않게 한다.
  celery-worker-llm:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: k8s_monitor_celery_llm
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1 -Q llm
    environment:
      - DEBUG=true
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/k8s_monitor
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # kubewatch — K8s 이벤트 실시간 감시 → PEP 웹훅
  # 로컬 kind 클러스터 사용 시: kind-setup.sh up 후 ~/.kube/config 가 kind 클러스터를 가리킴.
  # 주의(fail-closed): backend 는 KUBEWATCH_TOKEN 미설정 시 웹훅 수신을 503 으로
  # 거부한다(무인증 이벤트 주입 방지). 이 kubewatch 프로필을 실제로 쓰려면 backend/.env
  # 에 KUBEWATCH_TOKEN 을 설정하고, kubewatch 쪽에서도 웹훅 요청에
  # "Authorization: Bearer <같은 토큰>" 헤더가 실리도록 구성해야 한다(kubewatch 버전별
  # webhook header 설정 키는 공식 문서 참고 — 이 compose 파일의 기본 설정은 아직 헤더를
  # 보내지 않으므로 KUBEWATCH_TOKEN 을 설정하면 이 프로필은 401 을 받게 된다).
  kubewatch:
    image: bitnami/kubewatch:latest
    container_name: pep_kubewatch
    volumes:
      - ~/.kube/config:/opt/bitnami/kubewatch/.kube/config:ro
      - ./k8s/base/kubewatch/configmap.yaml:/tmp/kw-configmap.yaml:ro
    environment:
      - KUBEWATCH_CONFIG=/opt/bitnami/kubewatch/.kubewatch.yaml
    entrypoint:
      - sh
      - -c
      - |
        cat > /opt/bitnami/kubewatch/.kubewatch.yaml <<'EOF'
        handler:
          webhook:
            enabled: true
            url: "http://backend:8000/api/v1/events/kubewatch"
        resource:
          pod: true
          deployment: true
          node: true
          persistentvolumeclaim: true
        EOF
        /opt/bitnami/kubewatch/kubewatch
    depends_on:
      - backend
    profiles:
      - kubewatch

  # Grafana Image Renderer — PromQL 카드 패널 PNG 스냅샷
  grafana-renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: pep_grafana_renderer
    ports:
      - "8081:8081"
    environment:
      - ENABLE_METRICS=true
      - HTTP_PORT=8081
      - RENDERING_MODE=clustered
      - RENDERING_CLUSTERING_MODE=browser
      - RENDERING_CLUSTERING_MAX_CONCURRENCY=5
    profiles:
      - grafana-renderer

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: k8s_monitor_celery_beat
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      - DEBUG=true
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/k8s_monitor
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

networks:
  kind:
    external: true