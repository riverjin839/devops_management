<!doctype html>
<html lang="ko" data-theme="umber-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEP AI 개발 리포트</title>
<style id="themes">:root {
    --background: 210 40% 98%;        /* #F8FAFC slate-50 — body bg */
    --foreground: 222 47% 11%;        /* #0F172A slate-900 — body text */
    --card: 0 0% 100%;                /* pure white card */
    --card-foreground: 222 47% 11%;
    --popover: 0 0% 100%;
    --popover-foreground: 222 47% 11%;
    --primary: 200 98% 32%;           /* #0369A1 sky-700 — calmer than macOS blue */
    --primary-foreground: 0 0% 100%;
    /* P0 대비: 글자 전용 파생 토큰 — text-primary / text-status-* 가 참조(면색과 분리, 4.5:1 이상) */
    --primary-text: 200 98% 32%;
    --status-healthy-text: 142 71% 28%;
    --status-warning-text: 38 92% 30%;
    --status-critical-text: 0 84% 44%;
    --status-info-text: 199 89% 33%;
    --status-unknown-text: 220 9% 42%;
    --secondary: 210 33% 95%;         /* #E8ECF1 — secondary surface */
    --secondary-foreground: 222 47% 11%;
    --muted: 210 33% 96%;
    --muted-foreground: 215 16% 47%;  /* #64748B slate-500 */
    --accent: 200 80% 95%;
    --accent-foreground: 222 47% 11%;
    --destructive: 0 73% 50%;         /* #DC2626 red-600 */
    --destructive-foreground: 0 0% 100%;
    --border: 214 32% 91%;            /* #E2E8F0 slate-200 — subtle 1px borders */
    --input: 214 32% 91%;
    --ring: 222 47% 11%;              /* slate-900 focus ring */
    --radius: 0.5rem;                 /* 8px — flatter than macOS 14px */
    --card-shadow: 0 0 #0000;               /* flat — border replaces shadow. none 이 아닌 투명 그림자: Tailwind shadow 목록 안에 none 이 들어가면 box-shadow 전체(ring 포함)가 무효가 된다 */
    --card-shadow-hover: 0 0 #0000;
    /* 전역 상단바(AppTopBar) 높이 — 테마 무관 레이아웃 상수라 :root 에서 1회만 정의하고
       테마 블록에서 재정의하지 않는다. 소비는 아래 .app-min-h-screen/.app-h-screen
       유틸리티를 통한다. */
    --topbar-h: 3rem;

    /* ── Sidebar tokens (Databricks dark navy, light theme only) ──────── */
    --sidebar:                  214 30% 14%;   /* #1B2530 */
    --sidebar-foreground:       210 40% 96%;   /* #F1F5F9 */
    --sidebar-muted-foreground: 215 20% 65%;   /* #94A3B8 */
    --sidebar-accent:           217 33% 22%;   /* active item bg */
    --sidebar-accent-foreground: 0 0% 100%;
    --sidebar-border:           217 30% 24%;
    --sidebar-primary:          200 98% 60%;   /* brighter sky for dark bg */

    /* ── Semantic status tokens (DESIGN_SYSTEM §2.4) — 운영 도구 표준값 ─ */
    --status-healthy:     142 71% 45%;   /* #22C55E green-500 */
    --status-healthy-bg:  142 71% 92%;
    --status-warning:     38 92% 50%;    /* #F59E0B amber-500 */
    --status-warning-bg:  38 92% 92%;
    --status-critical:    0 84% 50%;     /* #DC2626 red-600 */
    --status-critical-bg: 0 84% 94%;
    --status-unknown:     220 9% 46%;    /* #6B7280 gray-500 */
    --status-unknown-bg:  220 9% 92%;
    --status-pending:     220 9% 46%;    /* alias of --status-unknown (legacy) */
    --status-pending-bg:  220 9% 92%;
    --status-info:        199 89% 48%;   /* #0EA5E9 sky-500 */
    --status-info-bg:     199 89% 92%;
    --status-neutral:     215 12% 55%;
    --status-neutral-bg:  215 12% 93%;

    /* ── Categorical chart tokens (D-005) — Recharts/SVG 시리즈 구분 전용 ──
       의미(성공/실패 등)가 있는 색은 --status-* 를 쓰고, 시리즈 구분용만 여기서 뽑는다.
       색맹 안전을 위해 red-green 계열이 인접하지 않도록 배치. */
    --chart-1: 217 70% 50%;   /* blue */
    --chart-2: 168 60% 45%;   /* teal/green */
    --chart-3: 38 85% 50%;    /* amber */
    --chart-4: 262 65% 55%;   /* violet */
    --chart-5: 340 65% 52%;   /* rose */
    --chart-6: 192 70% 45%;   /* cyan */
    --chart-7: 24 80% 52%;    /* orange */
    --chart-8: 215 15% 50%;   /* slate */

    /* ── Surface Container 5단계 (DESIGN_SYSTEM §2.1 확장, M3 개념 차용) ──
       그림자 대신 톤 차이로 깊이감을 준다(--card-shadow: none 철학과 일치).
       lowest(가장 밝음/바탕에 가까움) → highest(가장 진함/가장 도드라짐). */
    --surface-container-lowest:  210 40% 100%;
    --surface-container-low:     210 35% 98%;
    --surface-container:         210 33% 96.5%;
    --surface-container-high:    210 32% 95%;
    --surface-container-highest: 210 30% 93%;

    /* ── Brand tokens (외부 서비스 고유색. 앱 primary 와 구분) ── */
    --brand-jira:         216 100% 40%;  /* #0052CC Atlassian/Jira blue */
    --brand-servicenow:   160 84% 25%;   /* #04724D ServiceNow green */
    --brand-ai:           271 81% 56%;   /* #9333EA purple-600 — AI 관련 기능 배지 전용 */

    /* ── Motion — 모든 transition 기본값 통일 (Pre-delivery checklist 준수) ─ */
    --motion-fast: 150ms;
    --motion-base: 200ms;
    --motion-slow: 300ms;
    --motion-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  }
html[data-theme="dark"] {
    --background: 220 18% 7%;
    --foreground: 220 10% 96%;
    --card: 220 17% 10%;
    --card-foreground: 220 10% 96%;
    --popover: 220 17% 10%;
    --popover-foreground: 220 10% 96%;
    --primary: 212 100% 63%;
    --primary-foreground: 220 18% 7%;  /* P0: 밝은 primary 면 → 어두운 글자 */
    /* P0 대비: 글자 전용 파생 토큰 — text-primary / text-status-* 가 참조(면색과 분리, 4.5:1 이상) */
    --primary-text: 212 100% 63%;
    --status-healthy-text: 142 71% 45%;
    --status-warning-text: 38 92% 50%;
    --status-critical-text: 0 84% 66%;
    --status-info-text: 199 89% 55%;
    --status-unknown-text: 220 9% 60%;
    --secondary: 220 14% 16%;
    --secondary-foreground: 220 10% 96%;
    --muted: 220 14% 16%;
    --muted-foreground: 220 8% 68%;
    --accent: 217 72% 18%;
    --accent-foreground: 220 10% 96%;
    --destructive: 0 84% 60%;
    --destructive-foreground: 0 0% 98%;
    --border: 220 14% 20%;
    --input: 220 14% 20%;
    --ring: 212 100% 63%;
    --radius: 0.5rem;
    --card-shadow: 0 0 #0000;

    /* Dark theme: sidebar matches body so the dark navy doesn't double-up */
    --sidebar:                  220 18% 5%;
    --sidebar-foreground:       220 10% 96%;
    --sidebar-muted-foreground: 220 8% 68%;
    --sidebar-accent:           220 14% 18%;
    --sidebar-accent-foreground: 220 10% 96%;
    --sidebar-border:           220 14% 14%;
    --sidebar-primary:          212 100% 63%;

    /* Dark mode status (DESIGN_SYSTEM §2.4) — 전경 채도 유지, 배경 채도 ↓ */
    --status-healthy:     142 71% 45%;
    --status-healthy-bg:  142 50% 14%;
    --status-warning:     38 92% 50%;
    --status-warning-bg:  38 60% 14%;
    --status-critical:    0 84% 60%;
    --status-critical-bg: 0 60% 16%;
    --status-unknown:     220 9% 55%;
    --status-unknown-bg:  220 12% 18%;
    --status-pending:     220 9% 55%;
    --status-pending-bg:  220 12% 18%;
    --status-info:        199 89% 55%;
    --status-info-bg:     199 50% 16%;
    --status-neutral:     215 8% 60%;
    --status-neutral-bg:  215 8% 18%;

    /* Categorical chart tokens (D-005) — 다크: 명도를 55~65% 로 올려 대비 확보 */
    --chart-1: 217 80% 62%;   /* blue */
    --chart-2: 168 55% 55%;   /* teal/green */
    --chart-3: 40 90% 60%;    /* amber */
    --chart-4: 262 75% 65%;   /* violet */
    --chart-5: 340 70% 62%;   /* rose */
    --chart-6: 192 75% 58%;   /* cyan */
    --chart-7: 24 85% 60%;    /* orange */
    --chart-8: 215 15% 62%;   /* slate */

    /* Dark: 어두운 배경 위에서는 밝을수록 더 "떠 있는"(elevated) 톤 — lowest 는 background 와 동일. */
    --surface-container-lowest:  220 18% 7%;
    --surface-container-low:     220 17% 9%;
    --surface-container:         220 17% 11%;
    --surface-container-high:    220 15% 14%;
    --surface-container-highest: 220 14% 17%;

    --motion-fast: 150ms;
    --motion-base: 200ms;
    --motion-slow: 300ms;
    --motion-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  }

    /* P0 대비: 글자 전용 파생 토큰 — text-primary / text-status-* 가 참조(면색과 분리, 4.5:1 이상) */
    --primary-text: 200 98% 32%;

html[data-theme="comfort"] {
    /* 배경·면은 라이트 테마와 같은 명도 구조(배경 98% · 카드 ~100% · 보조면 94~96% · 경계 89~90%)를 따르고
       hue 만 테마 고유값을 남긴다 — 웜톤이 넓은 면을 덮지 않게 (2026-09 화이트 계열 보정). */
    --background: 60 15% 98%;
    --foreground: 160 20% 12%;         /* #182520 — green-tinted near-black */
    --card: 0 0% 100%;
    --card-foreground: 160 20% 12%;
    --popover: 0 0% 100%;
    --popover-foreground: 160 20% 12%;
    --primary: 150 45% 24%;            /* #22593D — deep green */
    --primary-foreground: 0 0% 100%;
    /* P0 대비: 글자 전용 파생 토큰 — text-primary / text-status-* 가 참조(면색과 분리, 4.5:1 이상) */
    --primary-text: 150 45% 24%;
    --status-healthy-text: 150 55% 30%;
    --status-warning-text: 38 92% 30%;
    --status-critical-text: 0 70% 45%;
    --status-info-text: 199 75% 34%;
    --status-unknown-text: 150 6% 39%;
    --secondary: 140 22% 95%;
    --secondary-foreground: 160 20% 12%;
    --muted: 70 12% 96%;
    --muted-foreground: 150 8% 40%;    /* #5E6E66 — muted green-gray */
    --accent: 145 40% 90%;             /* light mint hover */
    --accent-foreground: 150 45% 20%;
    --destructive: 0 70% 48%;
    --destructive-foreground: 0 0% 100%;
    --border: 70 10% 90%;
    --input: 70 10% 90%;
    --ring: 150 45% 30%;
    --radius: 0.75rem;                 /* 12px — P3: 카드 20 · 버튼/입력 16 · 타일 12 (xl/2xl 이 --radius 기준이 되며 16→12) */
    --card-shadow: 0 1px 3px rgba(24, 37, 32, 0.04), 0 6px 20px -8px rgba(24, 37, 32, 0.08);

    /* Sidebar — 본문과 같은 라이트 크림, 활성 항목만 딥그린 필 */
    --sidebar:                  60 15% 99%;
    --sidebar-foreground:       160 20% 14%;
    --sidebar-muted-foreground: 150 8% 42%;
    --sidebar-accent:           150 45% 24%;    /* deep green active pill */
    --sidebar-accent-foreground: 0 0% 100%;
    --sidebar-border:           70 10% 91%;
    --sidebar-primary:          150 45% 30%;

    /* Status — semantic 유지, healthy 는 테마 그린과 정렬 */
    --status-healthy:     150 55% 32%;
    --status-healthy-bg:  145 45% 90%;
    --status-warning:     38 92% 48%;
    --status-warning-bg:  40 75% 90%;
    --status-critical:    0 70% 48%;
    --status-critical-bg: 0 60% 93%;
    --status-unknown:     150 6% 45%;
    --status-unknown-bg:  90 10% 90%;
    --status-pending:     150 6% 45%;
    --status-pending-bg:  90 10% 90%;
    --status-info:        199 75% 40%;
    --status-info-bg:     199 55% 91%;
    --status-neutral:     150 6% 48%;
    --status-neutral-bg:  90 10% 91%;

    /* Categorical chart tokens (D-005) — chart-1은 타 테마와 동일하게 파랑 유지
       (--status-healthy 초록과 겹치지 않게: 완료/진행중 범례 등에서 chart-1을 상태색과
       나란히 쓰는 소비자가 있어, 그린을 1번에 두면 혼동된다) */
    --chart-1: 217 60% 48%;   /* blue */
    --chart-2: 150 45% 32%;   /* deep green */
    --chart-3: 38 85% 50%;    /* amber */
    --chart-4: 262 55% 55%;   /* violet */
    --chart-5: 340 55% 52%;   /* rose */
    --chart-6: 192 65% 42%;   /* cyan */
    --chart-7: 24 75% 50%;    /* orange */
    --chart-8: 150 8% 45%;    /* green-gray slate */

    /* Surface Container — 크림 스케일 (lowest=white → highest=deep cream) */
    --surface-container-lowest:  0 0% 100%;
    --surface-container-low:     60 15% 98%;
    --surface-container:         70 12% 96.5%;
    --surface-container-high:    70 12% 95%;
    --surface-container-highest: 70 10% 93%;

    --motion-fast: 150ms;
    --motion-base: 200ms;
    --motion-slow: 300ms;
    --motion-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  }

<style>
  :root { --radius-card: 10px; --gap: 20px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: hsl(var(--background)); color: hsl(var(--foreground));
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  .num { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-variant-numeric: tabular-nums; }
  a { color: hsl(var(--primary-text, var(--primary))); }

  /* ── 상단 툴바 ── */
  .bar {
    position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
    padding: 10px 24px; background: hsl(var(--card) / 0.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid hsl(var(--border));
  }
  .bar .brand { font-weight: 700; margin-right: auto; white-space: nowrap; }
  .bar label { font-size: 13px; color: hsl(var(--muted-foreground)); display: flex; gap: 6px; align-items: center; }
  select, button, input[type=search] {

  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid hsl(var(--ring, var(--primary))); outline-offset: 2px; }

  /* ── 섹션 ── */
  main { max-width: 1180px; margin: 0 auto; padding: 8px 24px 80px; }
  section { padding: 56px 0 24px; scroll-margin-top: 60px; }
  .kicker { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: hsl(var(--primary-text, var(--primary))); margin: 0 0 6px; }
  h1 { font-size: clamp(30px, 4.6vw, 48px); line-height: 1.2; margin: 0 0 12px; }

  .sub { color: hsl(var(--muted-foreground)); font-size: 18px; margin: 0; }
  .note { color: hsl(var(--muted-foreground)); font-size: 12px; margin-top: 12px; }
  .grid { display: grid; gap: var(--gap); }
  .g2 { grid-template-columns: 1.6fr 1fr; } .g2e { grid-template-columns: 1fr 1fr; }
  .g4 { grid-template-columns: repeat(4, 1fr); }
  .card { background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: var(--radius-card); padding: 20px; min-width: 0; }
  .card.hl { background: hsl(var(--accent)); border-color: transparent; }
  .card h3 { font-size: 15px; margin: 0 0 10px; }
  .kpi .v { font-size: clamp(30px, 4vw, 42px); font-weight: 800; line-height: 1.1; }
  .kpi .l { font-weight: 700; margin-top: 6px; }
  .kpi .d { color: hsl(var(--muted-foreground)); font-size: 13px; margin-top: 4px; }
  .hl .v, .acc { color: hsl(var(--primary-text, var(--primary))); }
  .muted { color: hsl(var(--muted-foreground)); }
  table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
  th { text-align: left; font-size: 13px; color: hsl(var(--muted-foreground)); font-weight: 700; padding: 0 14px; }
  td { background: hsl(var(--card)); padding: 12px 14px; border-top: 1px solid hsl(var(--border)); border-bottom: 1px solid hsl(var(--border)); vertical-align: middle; }
  td:first-child { border-left: 1px solid hsl(var(--border)); border-radius: var(--radius-card) 0 0 var(--radius-card); font-weight: 700; }
  td:last-child { border-right: 1px solid hsl(var(--border)); border-radius: 0 var(--radius-card) var(--radius-card) 0; }
  td.acc-cell { background: hsl(var(--accent)); color: hsl(var(--primary-text, var(--primary))); font-weight: 700; }
  .tablewrap { overflow-x: auto; }
  .tip-src { border-bottom: 1px dotted hsl(var(--muted-foreground)); cursor: help; }

  /* ── 차트 ── */
  .chart { width: 100%; min-height: 260px; position: relative; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart text { fill: hsl(var(--muted-foreground)); font-size: 12px; }
  .chart .lbl { fill: hsl(var(--foreground)); font-size: 11px; font-weight: 600; }
  .chart .grid line { stroke: hsl(var(--border)); }
  .chart rect.bar, .chart circle.pt { cursor: pointer; transition: opacity .15s; }
  .chart rect.bar:hover { opacity: .8; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; margin-bottom: 8px; }
  .legend button { border: 0; background: none; padding: 2px 0; min-height: 0; display: flex; gap: 6px; align-items: center; color: hsl(var(--foreground)); }
  .legend button.off { opacity: .35; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .tooltip {
    position: fixed; z-index: 50; pointer-events: none; background: hsl(var(--popover, var(--card))); color: hsl(var(--foreground));
    border: 1px solid hsl(var(--border)); border-radius: 8px; padding: 6px 10px; font-size: 13px; box-shadow: 0 6px 20px hsl(0 0% 0% / .15); display: none;
  }
  .hint { font-size: 12px; color: hsl(var(--muted-foreground)); }

  /* ── 타임라인 ── */
  .timeline { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(120px, 1fr); gap: 0; overflow-x: auto; padding: 8px 0 4px; }
  .timeline::before { content: ""; position: absolute; left: 0; right: 0; top: 44px; height: 4px; background: hsl(var(--border)); border-radius: 2px; }
  .tl { position: relative; text-align: center; padding: 0 6px; }
  .tl .d { font-weight: 700; font-size: 14px; height: 30px; }
  .tl .dot { width: 18px; height: 18px; border-radius: 50%; margin: 1px auto 10px; background: hsl(var(--muted-foreground)); border: 3px solid hsl(var(--background)); position: relative; }
  .tl.key .dot { background: hsl(var(--primary)); }
  .tl.key .d { color: hsl(var(--primary-text, var(--primary))); }
  .tl .t { font-size: 13px; color: hsl(var(--muted-foreground)); }

  /* ── 단계·로드맵 ── */
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .step .n { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: hsl(var(--secondary)); margin-bottom: 14px; }
  .step.hl .n { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
  .step .t { font-size: 18px; font-weight: 800; }
  .step .p { font-size: 13px; color: hsl(var(--muted-foreground)); margin: 2px 0 10px; }
  .step .m { font-size: 17px; font-weight: 800; margin-top: 14px; }

  /* ── 진척도 편집 ── */
  .rd-row { display: grid; grid-template-columns: 120px 1fr 44px; gap: 10px; align-items: center; margin: 8px 0; font-size: 14px; }
  .rd-row input[type=range] { width: 100%; accent-color: hsl(var(--primary)); }
  .meter { height: 14px; background: hsl(var(--secondary)); border-radius: 7px; overflow: hidden; }
  .meter > div { height: 100%; background: hsl(var(--primary)); border-radius: 7px; transition: width .25s; }
  .chip { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 6px; background: hsl(var(--secondary)); color: hsl(var(--foreground)); }
  .chip.acc { background: hsl(var(--accent)); color: hsl(var(--primary-text, var(--primary))); }

  /* ── 모듈 히트맵·기술 타임라인 ── */
  .heat { width: 100%; border-collapse: separate; border-spacing: 3px; font-size: 13px; }
  .heat th { padding: 2px 4px; font-size: 12px; text-align: center; }
  .heat th.rowh { text-align: left; white-space: nowrap; font-size: 13px; color: hsl(var(--foreground)); }
  .heat td { border: 0 !important; border-radius: 6px !important; padding: 0; height: 30px; min-width: 34px; text-align: center; cursor: pointer;
    background: hsl(var(--primary) / var(--a, 0)); color: hsl(var(--foreground)); font-weight: 600; font-variant-numeric: tabular-nums; }
  .heat td.zero { background: hsl(var(--secondary)); color: transparent; cursor: default; }
  .heat td:hover:not(.zero) { outline: 2px solid hsl(var(--primary)); }
  .mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .mod { cursor: pointer; transition: border-color .15s; }
  .mod:hover, .mod:focus-visible { border-color: hsl(var(--primary)); }
  .mod .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .mod .name { font-weight: 800; font-size: 16px; }
  .mod .stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: hsl(var(--muted-foreground)); margin: 6px 0 8px; }
  .mod .stats b { color: hsl(var(--foreground)); }
  .mod .desc { font-size: 14px; margin: 0 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .filters button { font-size: 12px; min-height: 28px; padding: 3px 10px; }
  .tmonth { display: grid; grid-template-columns: 70px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid hsl(var(--border)); }
  .tmonth:first-child { border-top: 0; }
  .tmonth .mm { font-weight: 800; color: hsl(var(--primary-text, var(--primary))); }
  .titem { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 4px 12px; padding: 4px 0; font-size: 14px; }
  .titem .src { font-size: 12px; color: hsl(var(--muted-foreground)); }
  details.deps summary { cursor: pointer; font-weight: 700; font-size: 14px; }
  details.deps ul { columns: 3 220px; font-size: 13px; padding-left: 18px; }
  @media (max-width: 600px) { .titem { grid-template-columns: 1fr; } .tmonth { grid-template-columns: 1fr; } }

  /* ── 로드맵·플레이북 ── */
  .rm { display: grid; grid-template-columns: 130px repeat(3, minmax(0, 1fr)); gap: 10px; align-items: start; }
  .rm .qh { font-weight: 800; color: hsl(var(--primary-text, var(--primary))); padding: 0 4px; }
  .rm .lh { font-weight: 800; padding-top: 10px; }
  .rm .cell { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .rm .it { background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: var(--radius-card); padding: 10px 12px; }
  .rm .it b { display: block; margin-bottom: 2px; }
  .rm .it p { margin: 0 0 6px; font-size: 13px; color: hsl(var(--muted-foreground)); }
  .rm .lane-ai .it { background: hsl(var(--accent)); border-color: transparent; }
  .feat ul { margin: 6px 0 10px; padding-left: 18px; font-size: 14px; } .feat li { margin: 2px 0; }
  .feat .top, .case .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; } .feat .name { font-weight: 800; font-size: 16px; }
  .cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 14px; }
  .case .top .chip { white-space: nowrap; flex-shrink: 0; } .case b { font-size: 16px; } .case p { margin: 8px 0 0; font-size: 14px; } .case .pr { color: hsl(var(--muted-foreground)); }
  .case .tag { display: inline-block; font-size: 11px; font-weight: 800; margin-right: 6px; padding: 0 6px; border-radius: 6px; background: hsl(var(--secondary)); color: hsl(var(--foreground)); }
  .case .tag.acc { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
  .calc { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px 12px; }
  .calc label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: hsl(var(--muted-foreground)); }
  .calc input { font: inherit; font-size: 14px; color: hsl(var(--foreground)); background: hsl(var(--background)); border: 1px solid hsl(var(--border)); border-radius: 8px; padding: 5px 8px; min-width: 0; }
  .csrc { padding: 8px 0; border-top: 1px solid hsl(var(--border)); font-size: 13px; } .csrc:first-of-type { border-top: 0; }
  .ev { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 8px; background: hsl(var(--secondary)); color: hsl(var(--foreground)); }
  .pb { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .pb ul { list-style: none; margin: 0; padding: 0; }
  .pb li { padding: 10px 0; border-top: 1px solid hsl(var(--border)); }
  .pb li:first-child { border-top: 0; }
  .pb li b { display: block; }
  .pb li span.d { font-size: 13px; color: hsl(var(--muted-foreground)); }
  @media (max-width: 860px) { .rm { grid-template-columns: 1fr; } .rm .qh.blank { display: none; } .pb { grid-template-columns: 1fr; } }

  /* ── 드릴다운 패널 ── */
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); z-index: 40; transform: translateX(100%); transition: transform .25s;
    background: hsl(var(--card)); border-left: 1px solid hsl(var(--border)); display: flex; flex-direction: column; box-shadow: -10px 0 30px hsl(0 0% 0% / .12);
  }
  .drawer.open { transform: none; }
  .drawer header { padding: 16px 18px; border-bottom: 1px solid hsl(var(--border)); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .drawer header h3 { margin: 0 auto 0 0; font-size: 17px; }
  .drawer ul { list-style: none; margin: 0; padding: 8px 18px 24px; overflow-y: auto; }
  .drawer li { padding: 10px 0; border-bottom: 1px solid hsl(var(--border)); font-size: 14px; }
  .drawer li .meta { font-size: 12px; color: hsl(var(--muted-foreground)); margin-top: 2px; }
  .era-edit { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13px; margin-bottom: 12px; }
  .era-edit span { display: flex; gap: 4px; align-items: center; }

  /* ── 발표 모드 ── */
  /* 한 화면 = 한 섹션. 넘치는 섹션은 .fit 을 축소해 화면에 맞춘다 (세로 스크롤 없음) */
  body.present { overflow: hidden; height: 100vh; }
  body.present main { max-width: none; padding: 0; }
  body.present main > section { display: none; height: calc(100vh - var(--barh, 56px)); padding: 3vh 5vw 7vh; overflow: hidden; touch-action: pan-y; }
  body.present main > section.active { display: block; }
  body.present .fit { transform-origin: top left; }
  body.present main > section.scrolly { overflow-y: auto; }
  body.present #tl-list { columns: 2 420px; column-gap: 28px; }
  body.present .tmonth { break-inside: avoid; }
  body.present .bar .doc-only { display: none; }
  .pager, .navbtn { display: none; }
  body.present .pager { display: flex; gap: 10px; align-items: center; position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px; z-index: 30;
    font-size: 12px; color: hsl(var(--muted-foreground)); background: hsl(var(--card) / .9); border: 1px solid hsl(var(--border)); border-radius: 999px; padding: 6px 14px; }
  .pager .prog { width: 120px; height: 4px; border-radius: 2px; background: hsl(var(--secondary)); overflow: hidden; }
  .pager .prog > i { display: block; height: 100%; background: hsl(var(--primary)); transition: width .2s; }
  body.present .navbtn { display: grid; place-items: center; position: fixed; top: 50%; z-index: 30; width: 44px; height: 44px; border-radius: 50%;
    font-size: 20px; padding: 0; background: hsl(var(--card) / .9); }
  .navbtn.prev { left: 10px; } .navbtn.next { right: 10px; }
  body.present .pager { white-space: nowrap; }
  @media (max-width: 700px) { body.present .navbtn { display: none; } .pager .hint-keys { display: none; } }  /* 폰은 스와이프로 넘긴다 */
  .navbtn:disabled { opacity: .3; cursor: default; }
  @keyframes slidein { from { opacity: 0; transform: translateX(var(--dx, 24px)); } to { opacity: 1; transform: none; } }
  body.present main > section.active { animation: slidein .22s ease-out; }
  @media (prefers-reduced-motion: reduce) { body.present main > section.active { animation: none; } }

  /* ── 반응형 ── */
  @media (max-width: 860px) {
    .g2, .g2e { grid-template-columns: 1fr; }
    .g4, .steps { grid-template-columns: 1fr 1fr; }
    .bar { padding: 8px 16px; } main { padding: 0 16px 60px; }
  }
  @media (max-width: 480px) { .g4, .steps { grid-template-columns: 1fr; } .rd-row { grid-template-columns: 96px 1fr 36px; } }

  /* ── 인쇄 (A4 가로, 섹션당 1페이지) ── */
  @page { size: A4 landscape; margin: 12mm; }
  @media print {
    .bar, .drawer, .tooltip, .pager, .navbtn, .noprint, .hint { display: none !important; }
    body.present { overflow: visible; height: auto; }
    body.present main > section { display: block !important; height: auto; padding: 0; animation: none; }
    .fit { transform: none !important; width: auto !important; }
    body { font-size: 13px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    main { max-width: none; padding: 0; }
    section { break-after: page; padding: 0; min-height: 0; }
    section:last-child { break-after: auto; }
    .card { break-inside: avoid; }
    .chart { min-height: 0; } .chart svg { height: 180px; } section { padding-top: 0; } h2 { margin-bottom: 12px; }
  }
</style>

<body>
<div class="bar" role="toolbar" aria-label="보고서 설정">
  <span class="brand">PEP · AI 개발 리포트</span>
  <label>테마 <select id="theme"></select></label>
  <label>기간 <select id="from"></select> ~ <select id="to"></select></label>
  <button id="mode" type="button" aria-pressed="false">발표 모드</button>
  <button id="print" type="button" class="doc-only">PDF 인쇄</button>
</div>
<main id="main"></main>
<aside class="drawer" id="drawer" aria-label="PR 상세" aria-hidden="true">
  <header>
    <h3 id="dr-title">PR 목록</h3>
    <input type="search" id="dr-q" placeholder="제목·브랜치 검색" aria-label="PR 검색">
    <select id="dr-kind" aria-label="종류"><option value="">전체</option><option value="feat">기능 포함</option><option value="fix">수정만</option><option value="ai">AI 작성</option></select>
    <button type="button" id="dr-close" aria-label="닫기" title="닫기">닫기</button>
  </header>
  <ul id="dr-list"></ul>
</aside>
<div class="tooltip" id="tip" role="status"></div>
<button type="button" class="navbtn prev" id="nav-prev" aria-label="이전 슬라이드" title="이전 (←)">‹</button>

      "built": "화면을 연 클러스터만 NS 를 오래된 순으로 시간 예산만큼 다시 모아 준실시간으로 갱신",

      "built": "request·usage 시계열로 축소를 추천하고, opt-in NS 에 적용·롤백·쿼터까지 실행 로그와 함께 자동화",

    {

      "built": "테넌트 바인딩으로 조회·실행·업무 데이터·LLM 라우팅·동시 실행 상한을 5단계로 격리하고, viewer 에게는 네트워크 정보를 숨긴다",
      "ver": "1.39.0 ~ 1.41.0 · 1.46.0"

  ],
  "cases_note": "모두 기존 오픈소스 도구(k9s·Lens·Grafana·Jira 기본 기능)에 없어 실무 중 직접 요청해 만든 기능이다. 버전은 CHANGELOG.md 의 해당 릴리스 섹션."
}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const N = JSON.parse(document.getElementById("narrative").textContent);
const THEMES = [{"key": "umber-light", "label": "움버 라이트"}, {"key": "high-contrast", "label": "고대비"}, {"key": "whanki", "label": "김환기 〈창〉"}, {"key": "dark", "label": "다크"}, {"key": "light", "label": "라이트 (슬레이트)"}, {"key": "relief", "label": "릴리프"}, {"key": "ozenfant", "label": "오장팡"}, {"key": "umber", "label": "움버"}, {"key": "journal", "label": "저널 〈아침 식사〉"}, {"key": "comfort", "label": "컴포트"}, {"key": "plaster", "label": "플라스터"}, {"key": "picasso-violin", "label": "피카소 〈바이올린〉"}, {"key": "picasso-girl", "label": "피카소 〈소녀의 머리〉"}, {"key": "picasso-portrait", "label": "피카소 〈소녀의 초상〉"}, {"key": "harlequin", "label": "할리퀸"}, {"key": "gris-guitar", "label": "후안 그리스 〈기타〉"}];
const $ = (s, r = document) => r.querySelector(s);
const fmt = n => n.toLocaleString("ko-KR");
const mLabel = m => `${+m.slice(5)}월`;
const C = { acc: "var(--primary)", mute: "var(--muted-foreground)" };
const store = { get(k) { try { return localStorage.getItem("pep-report:" + k); } catch { return null; } }, set(k, v) { try { localStorage.setItem("pep-report:" + k, v); } catch {} } };

/* ── 상태 ── */
const S = { from: D.months[0], to: D.months[D.months.length - 1], eras: N.eras.map(e => ({ ...e })), scores: N.readiness.map(r => r.score) };
const lastFull = (() => { const t = new Date(); const cur = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}`; return D.months.filter(m => m < cur).pop() || D.months[D.months.length - 1]; })();
S.to = lastFull;

/* ── 집계 (기간 필터 적용) ── */
function agg() {
  const months = D.months.filter(m => m >= S.from && m <= S.to);
  const inM = d => d.slice(0, 7) >= S.from && d.slice(0, 7) <= S.to;
  const commits = D.commits.filter(c => inM(c[0]));
  const prs = D.prs.filter(p => inM(p.d));
  const by = (arr, key) => { const o = {}; months.forEach(m => o[m] = []); arr.forEach(x => { const m = key(x).slice(0, 7); if (o[m]) o[m].push(x); }); return o; };
  const cm = by(commits, c => c[0]), pm = by(prs, p => p.d);
  const days = {}; months.forEach(m => days[m] = new Set());
  commits.forEach(c => days[c[0].slice(0, 7)]?.add(c[0])); prs.forEach(p => days[p.d.slice(0, 7)]?.add(p.d));
  const snaps = D.snapshots.filter(s => s.m >= S.from && s.m <= S.to);
  const releases = months.reduce((a, m) => a + (D.release_months[m] || 0), 0);
  return { months, commits, prs, cm, pm, days, snaps, releases,
    ai: commits.filter(c => c[1]).length, aiPr: prs.filter(p => p.ai).length,
    activeDays: months.reduce((a, m) => a + days[m].size, 0) };
}

/* ── 차트 공통 ── */
const tip = $("#tip");
function showTip(e, html) { tip.innerHTML = html; tip.style.display = "block"; const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8); tip.style.left = x + "px"; tip.style.top = (e.clientY + 14) + "px"; }
function hideTip() { tip.style.display = "none"; }
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs = {}, parent) { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }
const col = (v, a = 1) => `hsl(${v} / ${a})`;
function niceMax(v) { if (v <= 0) return 4; const raw = v / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / p; const step = [1, 2, 2.5, 3, 4, 5, 6, 8, 10].find(n => r <= n) * p; return step * 4; }

const charts = [];
function chart(host, draw) { const c = { host, draw, hidden: new Set() }; charts.push(c); return c; }
function renderChart(c) { c.host.innerHTML = ""; c.draw(c); }
let lastW = 0;
new ResizeObserver(() => { const w = document.body.clientWidth; if (w !== lastW) { lastW = w; charts.forEach(renderChart); } }).observe(document.body);

function legend(c, series) {
  const lg = document.createElement("div"); lg.className = "legend";
  series.forEach((s, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = c.hidden.has(i) ? "off" : "";
    b.innerHTML = `<i style="background:${col(s.color, s.alpha ?? 1)}"></i>${s.name}`;
    b.setAttribute("aria-pressed", String(!c.hidden.has(i)));
    b.onclick = () => { c.hidden.has(i) ? c.hidden.delete(i) : c.hidden.add(i); renderChart(c); };
    lg.appendChild(b);
  });
  c.host.appendChild(lg);
}

/* 세로 막대 (stacked | grouped) */
function bars(c, { labels, series, stacked = false, h = 260, onClick, valueLabels = true, unit = "", hlIndex }) {
  if (series.length > 1) legend(c, series);
  const W = Math.max(280, c.host.clientWidth), H = h, P = { l: 40, r: 8, t: 18, b: 28 };
  const vis = series.map((s, i) => c.hidden.has(i) ? null : s);
  const totals = labels.map((_, i) => stacked ? vis.reduce((a, s) => a + (s ? s.values[i] : 0), 0) : Math.max(0, ...vis.map(s => s ? s.values[i] : 0)));
  const max = niceMax(Math.max(...totals, 1));
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img" });
  const iw = W - P.l - P.r, ih = H - P.t - P.b, y = v => P.t + ih - v / max * ih;
  const g = el("g", { class: "grid" }, svg);
  for (let k = 0; k <= 4; k++) { const v = max * k / 4; el("line", { x1: P.l, x2: W - P.r, y1: y(v), y2: y(v) }, g); el("text", { x: P.l - 6, y: y(v) + 4, "text-anchor": "end" }, svg).textContent = fmt(Math.round(v)); }
  const bw = iw / labels.length, ng = stacked ? 1 : vis.filter(Boolean).length || 1, gap = bw * 0.22;
  labels.forEach((lab, i) => {
    const x0 = P.l + i * bw + gap / 2; let acc = 0, gi = 0;
    series.forEach((s, si) => {
      if (!vis[si]) return;
      const v = s.values[i], w = stacked ? bw - gap : (bw - gap) / ng;
      const x = stacked ? x0 : x0 + gi * w, yt = stacked ? y(acc + v) : y(v), hh = stacked ? y(acc) - y(acc + v) : y(0) - y(v);
      const color = s.colorAt ? s.colorAt(i) : s.color, alpha = s.alphaAt ? s.alphaAt(i) : (s.alpha ?? 1);
      const r = el("rect", { class: "bar", x, y: yt, width: Math.max(1, w - 1), height: Math.max(0, hh), rx: 3, fill: col(color, alpha) }, svg);
      r.addEventListener("mousemove", e => showTip(e, `<b>${lab}</b> · ${s.name}<br><span class="num">${fmt(v)}${unit}</span>${onClick ? '<br><span class="hint">클릭: 상세</span>' : ""}`));
      r.addEventListener("mouseleave", hideTip);
      if (onClick) r.addEventListener("click", () => onClick(i, si));
      if (valueLabels && !stacked && v > 0) el("text", { x: x + w / 2, y: yt - 4, "text-anchor": "middle", class: "lbl" }, svg).textContent = fmt(v);
      acc += v; gi++;
    });
    if (valueLabels && stacked && totals[i] > 0) el("text", { x: x0 + (bw - gap) / 2, y: y(totals[i]) - 4, "text-anchor": "middle", class: "lbl" }, svg).textContent = fmt(totals[i]);
    el("text", { x: x0 + (bw - gap) / 2, y: H - 8, "text-anchor": "middle" }, svg).textContent = lab;
  });
  c.host.appendChild(svg);
}

/* 꺾은선 */
function lines(c, { labels, series, h = 260, dec = 0, unit = "" }) {
  if (series.length > 1) legend(c, series);
  const W = Math.max(280, c.host.clientWidth), H = h, P = { l: 40, r: 14, t: 18, b: 28 }, inset = 18;
  const vis = series.filter((_, i) => !c.hidden.has(i));
  const max = niceMax(Math.max(1, ...vis.flatMap(s => s.values)));
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img" });
  const iw = W - P.l - P.r - inset * 2, ih = H - P.t - P.b, step = labels.length > 1 ? iw / (labels.length - 1) : 0;
  const x = i => P.l + inset + i * step, y = v => P.t + ih - v / max * ih;
  const g = el("g", { class: "grid" }, svg);
  for (let k = 0; k <= 4; k++) { const v = max * k / 4; el("line", { x1: P.l, x2: W - P.r, y1: y(v), y2: y(v) }, g); el("text", { x: P.l - 6, y: y(v) + 4, "text-anchor": "end" }, svg).textContent = fmt(+(v.toFixed(v % 1 ? 1 : 0))); }
  labels.forEach((l, i) => el("text", { x: x(i), y: H - 8, "text-anchor": "middle" }, svg).textContent = l);
  vis.forEach(s => {
    el("polyline", { points: s.values.map((v, i) => `${x(i)},${y(v)}`).join(" "), fill: "none", stroke: col(s.color, s.alpha ?? 1), "stroke-width": 3, "stroke-linejoin": "round" }, svg);
    s.values.forEach((v, i) => {
      const p = el("circle", { class: "pt", cx: x(i), cy: y(v), r: 5, fill: col(s.color, s.alpha ?? 1) }, svg);
      p.addEventListener("mousemove", e => showTip(e, `<b>${labels[i]}</b> · ${s.name}<br><span class="num">${fmt(+v.toFixed(dec))}${unit}</span>`)); p.addEventListener("mouseleave", hideTip);
      if (s.labels) el("text", { x: x(i), y: y(v) - 10, "text-anchor": "middle", class: "lbl" }, svg).textContent = fmt(+v.toFixed(dec));
    });
  });
  c.host.appendChild(svg);
}

/* 가로 막대 (값 차이가 큰 비교용 — 로그 스케일 선택) */
function hbars(c, { rows, log = true }) {
  const W = Math.max(280, c.host.clientWidth), rh = 46, P = { l: Math.min(150, W * 0.34), r: 120, t: 6 }, H = P.t + rows.length * rh;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img" });
  const f = v => log ? Math.log10(1 + v) : v, max = Math.max(...rows.map(r => f(r.value)), 1e-9), iw = W - P.l - P.r;
  rows.forEach((r, i) => {
    const y = P.t + i * rh, w = Math.max(2, f(r.value) / max * iw);
    el("text", { x: P.l - 10, y: y + rh / 2 + 5, "text-anchor": "end", class: r.hl ? "lbl" : "" }, svg).textContent = r.label;
    const b = el("rect", { class: "bar", x: P.l, y: y + 8, width: w, height: rh - 16, rx: 4, fill: col(r.hl ? C.acc : C.mute, r.hl ? 1 : .45) }, svg);
    b.addEventListener("mousemove", e => showTip(e, `<b>${r.label}</b><br><span class="num">${r.text}</span>`)); b.addEventListener("mouseleave", hideTip);
    el("text", { x: P.l + w + 8, y: y + rh / 2 + 5, class: "lbl" }, svg).textContent = r.text;
  });
  c.host.appendChild(svg);
  if (log) { const n = document.createElement("p"); n.className = "hint"; n.textContent = "막대 길이는 로그 스케일 (값 차이가 커서) — 정확한 값은 라벨"; c.host.appendChild(n); }
}

/* ── 섹션 렌더링 ── */
const sections = [];
function sec(id, kicker, title, body) { sections.push({ id, kicker, title, body }); }
function h(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content; }
function eraOf(m) { return S.eras.find(e => m >= e.from && m <= e.to); }
function modelEra(model) { return S.eras.find(e => e.models.includes(model)); }

function build() {
  const A = agg(), main = $("#main"); main.innerHTML = ""; charts.length = 0;
  const M = A.months, L = M.map(mLabel), share = A.commits.length ? Math.round(A.ai / A.commits.length * 100) : 0;
  const first = A.snaps[0], last = A.snaps[A.snaps.length - 1];
  const loc = s => s ? s.py + s.ts : 0;
  const perDay = A.activeDays ? (A.prs.length / A.activeDays) : 0;
  const overall = Math.round(S.scores.reduce((a, b) => a + b, 0) / S.scores.length);
  const range = `${M[0]} ~ ${M[M.length - 1]}`;

  const add = (id, kicker, title, node) => {
    const s = document.createElement("section"); s.id = id; s.setAttribute("aria-labelledby", id + "-h");
    const fit = document.createElement("div"); fit.className = "fit";
    fit.appendChild(h(`<p class="kicker">${kicker}</p><h2 id="${id}-h">${title}</h2>`)); fit.appendChild(node); s.appendChild(fit); main.appendChild(s); return s;
  };

  /* 1. 표지 */
  const cover = document.createElement("section"); cover.id = "cover";
  const coverFit = document.createElement("div"); coverFit.className = "fit"; cover.appendChild(coverFit);
  coverFit.appendChild(h(`
    <p class="kicker">팀 보고 · 데이터 ${D.meta.head} 기준</p>
    <h1>${N.title}</h1><p class="sub">${N.subtitle}</p>
    <p class="note">기간 ${range} · 원천 ${D.meta.repo} (${D.meta.rev}) · 생성 ${D.meta.generated}</p>
    <div class="grid g4" style="margin-top:28px">
      ${[[fmt(A.commits.length), "커밋", "병합·봇 제외"], [fmt(A.prs.length), "병합 PR", "'Merge pull request' 기준"], [fmt(A.releases), "자동 릴리스", "v* 태그"], [share + "%", "AI 작성 커밋", `${fmt(A.ai)} / ${fmt(A.commits.length)}`]]
        .map(([v, l, d], i) => `<div class="card kpi ${i === 3 ? "hl" : ""}"><div class="v num">${v}</div><div class="l">${l}</div><div class="d">${d}</div></div>`).join("")}
    </div>`));
  main.appendChild(cover);

  /* 2. 요약 */
  add("summary", "SUMMARY", "한 장 요약 — 구현은 AI, 사람은 의도·검증·하네스", h(`
    <div class="grid g4">
      <div class="card kpi"><div class="v num">${last ? Math.round(loc(last) / 1000) + "K" : "-"}</div><div class="l">코드 라인</div><div class="d">Python ${last ? Math.round(last.py / 1000) : 0}K + TS ${last ? Math.round(last.ts / 1000) : 0}K${first && loc(first) ? ` · 기간 시작 대비 ${(loc(last) / loc(first)).toFixed(1)}배` : ""}</div></div>
      <div class="card kpi"><div class="v num">${last ? fmt(last.tests) : "-"}</div><div class="l">백엔드 테스트</div><div class="d">월말 스냅샷의 def test_ 수</div></div>
      <div class="card kpi"><div class="v num">${perDay.toFixed(1)}</div><div class="l">PR / 작업일</div><div class="d">${fmt(A.prs.length)} PR ÷ ${A.activeDays} 작업일</div></div>
      <div class="card kpi hl"><div class="v num" data-overall>${overall}%</div><div class="l">상용화 진척도</div><div class="d">9개 영역 자체 평가 (진척도 섹션에서 조정 가능)</div></div>
    </div>
    <div class="card" style="margin-top:20px">${N.summary.map(([k, v]) => `<p style="margin:6px 0"><b class="acc">${k}</b> ${v}</p>`).join("")}</div>`));

  /* 3. Before / After */
  add("how", "HOW WE WORK", "개발 방식은 어떻게 바뀌었나", h(`<div class="tablewrap"><table><thead><tr><th>영역</th><th>BEFORE</th><th class="acc">AFTER (AI 페어)</th></tr></thead><tbody>
    ${N.beforeAfter.map(([a, b, c]) => `<tr><td>${a}</td><td class="muted">${b}</td><td>${c}</td></tr>`).join("")}</tbody></table></div>`));

  /* 4. 하네스 타임라인 */
  const keyLabels = new Set(["CLAUDE.md 도입", "스킬 + CHANGELOG", "자동 릴리스", "UX 에이전트·DESIGN.md"]);
  add("timeline", "TIMELINE", "AI 를 잘 쓰기 위한 '하네스'가 쌓여 온 과정", h(`
    <div class="card"><div class="timeline">${D.harness.map(x => `<div class="tl ${keyLabels.has(x.label) ? "key" : ""}"><div class="d num">${x.d.slice(5)}</div><div class="dot"></div><div class="t">${x.label}</div></div>`).join("")}</div></div>
    <div class="card hl" style="margin-top:16px"><b class="acc">핵심 관찰</b> 모델이 아니라 '저장소에 남긴 규칙'이 생산성을 바꿨다. 아래 처리량 섹션에서 하네스 도입 전후 월 PR 을 직접 비교할 수 있다.</div>`));

  /* 5. AI 기여도 */
  const s5 = add("share", "AI SHARE", `작성 주체 — 커밋의 ${share}% 를 AI 가 작성`, h(`
    <div class="grid g2"><div class="card"><h3>월별 커밋 (병합·봇 제외)</h3><div class="chart" id="c-share"></div><p class="hint">범례를 누르면 계열을 숨긴다. 막대를 누르면 그 달 PR 목록이 열린다.</p></div>
    <div class="grid" style="align-content:start">
      <div class="card kpi hl"><div class="v num">${fmt(A.ai)} / ${fmt(A.commits.length)}</div><div class="d">AI 작성 커밋 (${share}%) — 작성자 Claude 또는 Co-Authored-By 트레일러</div></div>

  const feat = M.map(m => A.cm[m].filter(x => x[2] === "feat").length), fix = M.map(m => A.cm[m].filter(x => x[2] === "fix").length);
  chart($("#c-ff", s9), c => bars(c, { labels: L, valueLabels: false, series: [{ name: "feat", color: C.acc, values: feat }, { name: "fix", color: C.mute, alpha: .5, values: fix }] }));
  const ratio = M.map((_, i) => feat[i] + fix[i] ? Math.round(fix[i] / (feat[i] + fix[i]) * 100) : 0), rMax = ratio.indexOf(Math.max(...ratio));
  $("#ff-note", s9).textContent = `fix 비율 최고: ${L[rMax]} ${ratio[rMax]}% · 마지막 달 ${L[L.length - 1]} ${ratio[ratio.length - 1]}%`;

  /* 9-1. 일반 개발 대비 장단점 */
  const CMP = N.compare || { pros: [], cons: [] };
  const cmpLi = ([t, d, k]) => `<li><b>${t}</b><span class="d">${d}</span><div style="margin-top:4px">${k ? ev(k) : '<span class="ev muted">정성 평가</span>'}</div></li>`;
  add("vs-dev", "AI vs 일반 개발", "일반 개발자 개발과 비교하면 — 장점과 단점", h(`<div class="pb">

    <p class="note">근거 칩은 data.json 에서 계산한 이 저장소 실측치, '정성 평가'는 개발자 본인의 판단이다. 같은 기능을 일반 개발팀이 만든 대조군은 없으므로 비교는 경험·업계 통념 기준이다.</p>`));

  /* 9-2. 비용 비교 (입력 조정 가능) */
  const CO = { ...(N.cost || {}), ...S.cost };
  const costMonths = M.length, ksloc = loc(last) / 1000;
  const s92 = add("cost", "COST", "비용 비교 — AI 와 1인 개발 vs 일반 개발 추정", h(`

    <div class="grid g2" style="margin-top:16px"><div class="card"><h3>총비용 (억 원) <span class="hint">· 기간 ${costMonths}개월 · 코드 ${Math.round(ksloc)}K 줄</span></h3><div class="chart" id="c-cost"></div><p class="hint" id="cost-x"></p></div>
    <div class="card" id="cost-src"></div></div>
    <p class="note">주의 — LoC 기반(LoC/일·COCOMO)은 AI 코드가 사람보다 길어 과대 추정된다. 가장 보수적인 비교치는 '기능 기반'이다. 남은 상용화 공백(SSO·프론트 테스트·관측성)은 양쪽 모두 미포함, 실제 비용의 FTE 는 가정치다.</p>`));
  const costCalc = () => {
    const c = CO, real = costMonths * c.workDays * c.humanFte * c.dayRate + costMonths * c.aiMonthlyUsd * c.fx;
    const featDays = (last ? last.pages : 0) * c.daysPerPage + (last ? last.routers : 0) * c.daysPerRouter + +c.daysInfra;
    const pm = 2.94 * Math.pow(ksloc, 1.0997);
    return [
      { k: "실제 (AI + 1인)", v: real, f: `${costMonths}개월 × ${c.workDays}일 × ${c.humanFte}명 × ${fmt(c.dayRate)}원 + AI 구독 $${c.aiMonthlyUsd} × ${costMonths}개월 × ${fmt(c.fx)}원`, src: [c.dayRateSrc, c.workDaysSrc, c.aiMonthlySrc, c.humanFteSrc] },
      { k: "기능 기반 추정", v: featDays * c.dayRate, f: `화면 ${last ? last.pages : 0}×${c.daysPerPage} + 라우터 ${last ? last.routers : 0}×${c.daysPerRouter} + ${c.daysInfra} = ${fmt(featDays)}인일 × 일단가`, src: [c.featureSrc] },
      { k: "LoC 생산성 기준", v: ksloc * 1000 / c.locPerDay * c.dayRate, f: `${fmt(Math.round(ksloc * 1000))}줄 ÷ ${c.locPerDay}줄/일 = ${fmt(Math.round(ksloc * 1000 / c.locPerDay))}인일 × 일단가`, src: [c.locPerDaySrc] },
      { k: "COCOMO II", v: pm * 19 * c.dayRate, f: `2.94 × ${ksloc.toFixed(0)}^1.0997 = ${fmt(Math.round(pm))}PM × 19일(152h) × 일단가`, src: [c.cocomoSrc] },
    ];
  };
  const eok = v => (v / 1e8).toFixed(v < 1e9 ? 2 : 1);
  const costChart = chart($("#c-cost", s92), c => {
    const rows = costCalc(), base = rows[0].v;
    hbars(c, { rows: rows.map((r, i) => ({ label: r.k, value: r.v / 1e8, text: `${eok(r.v)}억${i ? ` · ×${(r.v / base).toFixed(1)}` : ""}`, hl: i === 0 })) });
    $("#cost-x", s92).textContent = `실제 대비 — 기능 기반 ${(rows[1].v / base).toFixed(1)}배 · LoC ${(rows[2].v / base).toFixed(1)}배 · COCOMO ${(rows[3].v / base).toFixed(1)}배`;
    $("#cost-src", s92).innerHTML = `<h3>산식과 근거</h3>${rows.map(r => `<div class="csrc"><b>${r.k} <span class="num acc">${eok(r.v)}억</span></b><div class="num">${r.f}</div>${r.src.filter(Boolean).map(x => `<div class="hint">· ${x}</div>`).join("")}</div>`).join("")}`;
  });
  s92.querySelectorAll(".calc input").forEach(inp => inp.oninput = () => { const v = parseFloat(inp.value); if (!isNaN(v) && v >= 0) { S.cost = { ...(S.cost || {}), [inp.dataset.k]: v }; CO[inp.dataset.k] = v; renderChart(costChart); } });

  /* 10. 성숙도 */
  add("maturity", "MATURITY", "AI 활용 성숙도 — 4단계로 진화", h(`<div class="steps">${N.maturity.map((st, i) => {
    const ms = D.months.filter(m => m >= st.from && m <= st.to), avg = Math.round(D.prs.filter(p => ms.includes(p.d.slice(0, 7))).length / (ms.length || 1));

    <p class="note">PR/월 = 해당 구간 월평균 병합 PR (기간 필터와 무관하게 단계 구간 기준)</p>`));

  /* 11. 상용화 진척도 (조정 가능) */
  const s11 = add("readiness", "READINESS", `상용화까지 얼마나 왔나 — 종합 <span data-overall>${overall}%</span>`, h(`
    <div class="grid g2"><div class="card"><h3>영역별 진척도 <span class="hint">(슬라이더로 가정 조정 → 종합 즉시 재계산)</span></h3><div id="rd"></div>

    <div class="card"><h3>평가 근거</h3>${N.readiness.map(r => `<p style="margin:6px 0;font-size:14px"><b class="acc">${r.area}</b> <span class="muted">${r.evidence}</span></p>`).join("")}</div></div>
    <p class="note">자체 평가: 9개 영역 동일 가중 평균 · 70% 이상 = 상용 기준 충족(강조색)</p>`));
  const rd = $("#rd", s11);
  N.readiness.forEach((r, i) => {
    const row = h(`<div class="rd-row"><span>${r.area}</span><input type="range" min="0" max="100" step="5" value="${S.scores[i]}" aria-label="${r.area} 진척도"><b class="num">${S.scores[i]}</b></div>`).firstElementChild;

  $("#rd-target", s11).onclick = () => setScores(N.readiness.map(r => r.target));
  $("#rd-reset", s11).onclick = () => setScores(N.readiness.map(r => r.score));

  /* 12. 남은 과제 */
  add("next", "NEXT", "남은 과제 — 상용 전환을 막는 5가지", h(`<div class="tablewrap"><table><thead><tr><th>우선</th><th>과제</th><th>내용</th><th>목표 지표</th></tr></thead><tbody>
    ${N.tasks.map(t => { const r = N.readiness.find(x => x.area === t.area); return `<tr><td><span class="chip ${t.p === "P0" ? "acc" : ""}">${t.p}</span></td><td><b>${t.title}</b></td><td class="muted">${t.desc}</td><td class="num">${t.area} ${r.score} → <b class="acc">${r.target}</b></td></tr>`; }).join("")}
    </tbody></table></div><p class="note">목표를 모두 달성하면 종합 ${overall}% → ${Math.round(N.readiness.reduce((a, r) => a + r.target, 0) / N.readiness.length)}% (진척도 섹션의 '목표 달성 시 보기'와 같다)</p>`));

  /* 12-2. 향후 로드맵 */
  const RM = N.roadmap_next || { quarters: [], lanes: [] };

  /* 14. 다시 짠다면 */
  add("restart", "IF WE STARTED OVER", "다시 짠다면 — 기능보다 '틀'을 먼저 깐다", h(`<div class="steps">${N.roadmap.map(([w, t, d], i) => `<div class="card step ${i === 0 ? "hl" : ""}"><div class="p acc" style="font-weight:700">${w}</div><div class="t">${t}</div><div class="muted" style="font-size:14px;margin-top:8px">${d}</div></div>`).join("")}</div>
    <div class="grid g2e" style="margin-top:16px"><div class="card"><b class="muted">실제 순서</b><p style="margin:6px 0 0">기능 → 컨텍스트 → 게이트 → 안정화 → 비기능(미완)</p></div>
    <div class="card hl"><b class="acc">기대 효과 (추정)</b><p style="margin:6px 0 0">남은 과제 5개 중 4개를 먼저 깔고 기능을 얹었을 것. fix 급증과 UX 재작업이 가장 크게 줄었을 구간이다.</p></div></div>`));

  /* 15. 교훈 */
  add("lessons", "LESSONS", "얻은 3가지 — AI 는 속도를 주고, 하네스는 방향을 준다", h(`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${N.lessons.map(([t, d], i) => `<div class="card"><div class="step"><div class="n num" style="background:hsl(var(--primary));color:hsl(var(--primary-foreground))">${i + 1}</div></div><div style="font-size:18px;font-weight:800">${t}</div><p class="muted">${d}</p></div>`).join("")}</div>`));

function updateOverall() { const o = Math.round(S.scores.reduce((a, b) => a + b, 0) / S.scores.length); document.querySelectorAll("[data-overall]").forEach(n => n.textContent = o + "%"); }

/* ── 드릴다운 ── */
let drawerMonth = null, drawerGen = null, drawerMod = null;
const drawerLabel = () => [drawerMonth || `${S.from} ~ ${S.to}`, drawerGen, drawerMod && ((N.modules || []).find(m => m.key === drawerMod) || {}).label].filter(Boolean).join(" · ");
function openDrawer(m, gen, mod) {
  drawerMonth = m || null; drawerGen = gen || null; drawerMod = mod || null;
  $("#dr-title").textContent = drawerLabel();
  const d = $("#drawer"); d.classList.add("open"); d.setAttribute("aria-hidden", "false"); renderDrawer(); $("#dr-q").focus();
}
function renderDrawer() {
  const q = $("#dr-q").value.trim().toLowerCase(), kind = $("#dr-kind").value;
  const genOf = p => (modelEra(p.model) || {}).key || "미표기";
  const inRange = p => drawerMonth ? p.d.startsWith(drawerMonth) : (p.d.slice(0, 7) >= S.from && p.d.slice(0, 7) <= S.to);
  const list = D.prs.filter(inRange).filter(p => !drawerGen || genOf(p) === drawerGen).filter(p => !drawerMod || p.mods.includes(drawerMod))
    .filter(p => !q || (p.t + " " + p.b).toLowerCase().includes(q))
    .filter(p => kind === "feat" ? p.feat : kind === "fix" ? p.fixonly : kind === "ai" ? p.ai : true);
  $("#dr-list").innerHTML = list.length ? list.map(p => `<li><a href="https://github.com/${D.meta.repo}/pull/${p.n}" target="_blank" rel="noopener">#${p.n}</a> ${p.t.replace(/</g, "&lt;")}
    <div class="meta">${p.d} · ${p.feat ? '<span class="chip acc">feat</span> ' : ""}${p.fixonly ? '<span class="chip">fix</span> ' : ""}${p.model || "모델 미표기"} · 파일 ${p.files} · +${fmt(p.adds)}줄${p.mods.length ? " · " + p.mods.map(k => ((N.modules || []).find(m => m.key === k) || {}).label || k).join(", ") : ""}</div></li>`).join("")
    : `<li class="muted">조건에 맞는 PR 이 없다.</li>`;
  $("#dr-title").textContent = `${drawerLabel()} PR (${list.length}건)`;
}
function closeDrawer() { const d = $("#drawer"); d.classList.remove("open"); d.setAttribute("aria-hidden", "true"); }
$("#dr-q").oninput = renderDrawer; $("#dr-kind").onchange = renderDrawer; $("#dr-close").onclick = closeDrawer;

/* ── 툴바 ── */

THEMES.forEach(t => themeSel.add(new Option(t.label, t.key)));

setTheme(store.get("theme") && THEMES.some(t => t.key === store.get("theme")) ? store.get("theme") : "umber-light");

/* ── 발표 모드: 페이징 (한 화면 = 한 섹션) ── */
const modeBtn = $("#mode");
let cur = 0;
const isPresent = () => document.body.classList.contains("present");
function secs() { return [...document.querySelectorAll("main > section")]; }
function fitSlide(sec) {
  const fit = sec.querySelector(".fit"); if (!fit) return;
  const own = charts.filter(c => sec.contains(c.host));
  const cs = getComputedStyle(sec), availH = sec.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const apply = k => {  // k<1: 폭을 1/k 로 넓혀 다시 배치한 뒤 k 배 축소 — 가로 공간을 버리지 않는다
    fit.style.width = k < 1 ? (100 / k) + "%" : ""; fit.style.transform = k < 1 ? `scale(${k})` : ""; own.forEach(renderChart);
  };
  // 읽을 수 있는 최소 배율 아래로는 줄이지 않는다 — 그때만 그 슬라이드 안에서 세로 스크롤을 허용
  const MIN = innerWidth < 700 ? 0.85 : 0.5;
  sec.classList.remove("scrolly");
  const fits = k => { apply(k); return fit.scrollHeight * k <= availH + 1; };
  if (fits(1)) return;
  if (!fits(MIN)) { sec.classList.add("scrolly"); return; }
  let lo = MIN, hi = 1;  // 화면에 들어가는 가장 큰 배율을 이분 탐색
  for (let i = 0; i < 7; i++) { const mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid; }
  apply(lo);
}
function show(i, dir = 1) {
  const s = secs(); cur = Math.max(0, Math.min(s.length - 1, i));
  s.forEach((x, k) => x.classList.toggle("active", k === cur));
  s[cur].style.setProperty("--dx", dir >= 0 ? "24px" : "-24px");
  fitSlide(s[cur]); updatePager();
  try { history.replaceState(null, "", "#" + s[cur].id); } catch {}
}
function go(d) { if (isPresent()) show(cur + d, d); }
function updatePager() {
  const n = secs().length;
  $("#pg-n").textContent = `${cur + 1} / ${n}`; $("#pg-bar").style.width = ((cur + 1) / n * 100) + "%";
  $("#nav-prev").disabled = cur === 0; $("#nav-next").disabled = cur === n - 1;
}
function setMode(p) {
  if (p) { const s = secs(); cur = Math.max(0, s.findIndex(x => x.getBoundingClientRect().bottom > 80)); }
  document.body.classList.toggle("present", p); modeBtn.classList.toggle("on", p); modeBtn.setAttribute("aria-pressed", String(p));
  modeBtn.textContent = p ? "문서 모드" : "발표 모드";
  document.documentElement.style.setProperty("--barh", $(".bar").offsetHeight + "px");
  if (p) show(cur, 0);
  else { secs().forEach(x => { x.classList.remove("active"); const f = x.querySelector(".fit"); if (f) { f.style.transform = ""; f.style.width = ""; } }); charts.forEach(renderChart); secs()[cur].scrollIntoView(); }
}
modeBtn.onclick = () => setMode(!isPresent());
$("#nav-prev").onclick = () => go(-1); $("#nav-next").onclick = () => go(1);
addEventListener("resize", () => { if (isPresent()) { document.documentElement.style.setProperty("--barh", $(".bar").offsetHeight + "px"); fitSlide(secs()[cur]); } });
/* 스와이프: 가로 이동이 세로보다 크고 50px 이상이면 넘긴다 */
let sx = null, sy = null;
$("#main").addEventListener("pointerdown", e => { if (isPresent() && e.pointerType !== "mouse") { sx = e.clientX; sy = e.clientY; } });
$("#main").addEventListener("pointerup", e => {
  if (sx === null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = sy = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) go(dx < 0 ? 1 : -1);
});
$("#main").addEventListener("pointercancel", () => { sx = sy = null; });
addEventListener("keydown", e => {
  if (e.key === "Escape") { if ($("#drawer").classList.contains("open")) closeDrawer(); else if (isPresent()) setMode(false); return; }
  if (e.target.matches("input, select, textarea")) return;
  if (!isPresent() || $("#drawer").classList.contains("open")) return;
  if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(1); }
  if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); go(-1); }
  if (e.key === "Home") { e.preventDefault(); show(0, -1); }
  if (e.key === "End") { e.preventDefault(); show(secs().length - 1, 1); }
});
addEventListener("beforeprint", () => charts.forEach(renderChart));

build();
</script>
</body>
</html>
