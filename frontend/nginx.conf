server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 업로드 크기 제한 — 기본값(1m)이면 Jira Excel/백업/kubeconfig 등 파일 업로드가
    # 413 로 거부된다. k8s ingress(nginx.ingress.kubernetes.io/proxy-body-size)와 동일하게 맞춤.
    #
    # 주의: k8s 배포에서는 k8s/base/frontend/nginx-configmap.yaml 이 volumeMount 로
    # /etc/nginx/conf.d/default.conf 를 덮어써 이 파일(이미지에 빌드됨)을 완전히 무시한다.
    # 여기를 고칠 때는 반드시 그 ConfigMap 도 동일하게 수정해야 실제 k8s 배포에 반영된다
    # (docker-compose/로컬 실행에서만 이 파일이 실제로 쓰인다).
    client_max_body_size 10m;

    # Gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # SPA 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Pod exec 웹소켓 + SSE 스트림(로그/이벤트 tail) — 대화형 터미널/장시간 스트림이라
    # 일반 API 프록시의 기본 60s read timeout 에 걸려 끊기면 안 된다. 정규식 location 이
    # 아래 일반 /api prefix location 보다 항상 우선 매치된다(순서 무관).
    location ~ ^/api/v1/(k8s/[^/]+/exec|analyze/.*/stream) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # API 프록시
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 정적 파일 캐싱
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers — k8s/base/frontend/nginx-configmap.yaml 과 동일하게 유지
    # (그쪽은 k8s 배포에서 이 파일을 완전히 대체하므로 두 파일 모두 고쳐야 한다).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;
}
