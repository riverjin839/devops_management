<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PEP — Platform Engineering Portal</title>
    <script>
      // D-070 — 테마 플래시(FOUC) 방지. React/themeStore 가 뜨기 전에 저장된 테마 클래스를
      // <html> 에 먼저 붙인다. 판정 규칙은 src/stores/themeStore.ts 의 applyTheme 과 동일해야
      // 한다(standalone 8종은 그대로 클래스, system 은 OS 설정 → light/dark, 레거시 'claude' 는
      // 'default'). 저장값이 없거나 이상하면 기본 테마 'default'.
      (function () {
        var STANDALONE = ['default', 'comfort', 'burnt-sienna', 'tuscan-sunset', 'electropop',
          'summer-breeze', 'wildflower-meadow', 'tropical-punch'];
        var t = null;
        try { t = localStorage.getItem('k8s:theme'); } catch (e) { /* storage 차단 환경 */ }
        if (t === 'claude') t = 'default';
        var cls;
        if (t && STANDALONE.indexOf(t) >= 0) cls = t;
        else if (t === 'light' || t === 'dark') cls = t;
        else if (t === 'system') cls = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        else cls = 'default';
        document.documentElement.classList.add(cls);
      })();
    </script>
    <style>
      /* 로더 색은 index.css 의 테마 토큰(--background/--foreground)과 같은 값 — CSS 가 아직
         로드되지 않은 시점이라 여기서 클래스별로 직접 준다. 기본은 default(라이트 페이퍼). */
      body { margin: 0; background: hsl(36 38% 96%); color: hsl(28 18% 16%); font-family: system-ui, -apple-system, sans-serif; }
      html.light body { background: hsl(210 40% 98%); color: hsl(222 47% 11%); }
      html.dark body { background: hsl(220 18% 7%); color: hsl(220 10% 96%); }
      html.electropop body { background: hsl(260 25% 8%); color: hsl(70 10% 94%); }
      #app-loader { display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 12px; }
      #app-loader .spinner { width: 32px; height: 32px; border: 3px solid currentColor; border-top-color: transparent; border-radius: 50%; opacity: 0.55; animation: spin 0.8s linear infinite; }
      #app-loader p { font-size: 14px; opacity: 0.7; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loader">
        <div class="spinner"></div>
        <p>PEP — Platform Engineering Portal 로딩 중…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // JS 로드 실패 감지 (10초 후에도 React가 마운트 안 되면 에러 표시)
      setTimeout(function() {
        var loader = document.getElementById('app-loader');
        if (loader) {
          loader.innerHTML = '<p style="color:#ef4444;font-size:16px;">⚠ 애플리케이션을 불러오지 못했습니다</p>' +
            '<p style="font-size:13px;opacity:0.7;">F12 → Console 탭에서 오류를 확인하세요</p>' +
            '<p style="font-size:12px;opacity:0.6;">Backend API: <a href="/api/v1/health/summary" style="color:inherit">/api/v1/health/summary</a></p>';
        }
      }, 10000);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  </body>
</html>
