# Gateway API(Cilium Gateway) 진입점 — ingress-nginx 대체. 리스너는 이 앱 전용이다.
# hostname 은 overlay 에서 patch 한다(아래 kustomization.yaml 주석 참고).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: k8s-monitor-gw
  labels:
    app.kubernetes.io/name: k8s-daily-monitor
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: k8s-monitor.local
      allowedRoutes:
        namespaces:
          from: Same
