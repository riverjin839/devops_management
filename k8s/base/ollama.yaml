---
# Ollama Deployment - CPU-Optimized inference
# This is OPTIONAL: If not deployed, the AI Agent feature is simply disabled.
# Air-gap note: Use an image with the model pre-baked. Do NOT add 'ollama pull' in args
# when deploying in a closed network — it will fail or hang indefinitely.
# Image is built by .github/workflows/ollama-qwen2.5-coder.yml from
# docker/ollama-qwen2.5-coder/Dockerfile, which fails the build itself if the model
# isn't actually present after pull — see that Dockerfile for why this replaced the
# previous hand-built ghcr.io/riverjin839/ollama-qwen2.5-coder:7b image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: k8s-monitor
  labels:
    app: ollama
    component: ai-agent
spec:
  replicas: 1
  strategy:
    type: Recreate          # Single model in memory — avoid dual-pod OOM during rollout
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
        component: ai-agent
    spec:
      containers:
        - name: ollama
          image: ghcr.io/riverjin839/devops_management/ollama-qwen2.5-coder:7b
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Start Ollama server in background
              ollama serve &
              # Wait for server to be ready — use 'ollama list' itself rather than curl,
              # so a minimal base image without curl doesn't get stuck here forever.
              until ollama list > /dev/null 2>&1; do
                echo "Waiting for Ollama server..."
                sleep 2
              done
              echo "Ollama server ready. Pre-baked model is available."
              ollama list
              # Keep container running (wait for background serve process)
              wait
          ports:
            - containerPort: 11434
              protocol: TCP
          env:
            - name: OLLAMA_NUM_PARALLEL
              value: "2"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_HOST
              value: "0.0.0.0"
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 16Gi
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # No volumeMount for /root/.ollama — mounting an emptyDir there would shadow
          # models baked into the image. For persistent model storage across pod restarts,
          # add a PVC in your overlay (k8s/overlays/<env>/ollama-pvc.yaml).
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels:
    app: ollama
    component: ai-agent
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
      protocol: TCP
      name: http
