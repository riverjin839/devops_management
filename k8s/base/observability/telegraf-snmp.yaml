---
# Telegraf — SNMP 폴링 수집기 (네트워크 장비 → Prometheus)
# 장비(라우터/스위치)는 UDP 161 로 폴링. 결과는 prometheus_client(:9273)로 노출 → Prometheus 가 스크랩.
# MIB 의존을 없애려 **숫자 OID** 만 사용(컨테이너에 MIB 파일 불필요 → 에어갭/대규모에서 안정적).
apiVersion: v1
kind: ConfigMap
metadata:
  name: telegraf-snmp-config
  namespace: network-observability
  labels: { app: telegraf-snmp, component: observability }
data:
  telegraf.conf: |
    [agent]
      interval = "30s"
      flush_interval = "30s"
      omit_hostname = true

    # ── 출력: Prometheus 가 스크랩할 /metrics (:9273) ──────────────────────────
    [[outputs.prometheus_client]]
      listen = ":9273"
      metric_version = 2

    # ── 입력: SNMP 폴링 (장비 IP/커뮤니티는 환경에 맞게 채울 것) ─────────────────
    # agents 는 SNMP_AGENTS env 로 주입(아래 Deployment). 커뮤니티는 Secret 권장.
    [[inputs.snmp]]
      agents = ["$SNMP_AGENTS"]
      version = 2
      community = "$SNMP_COMMUNITY"
      timeout = "10s"
      retries = 1

      # 시스템 식별 (숫자 OID)
      [[inputs.snmp.field]]
        name = "sysName"
        oid = "1.3.6.1.2.1.1.5.0"     # RFC1213 sysName.0
        is_tag = true
      [[inputs.snmp.field]]
        name = "sysUpTime"
        oid = "1.3.6.1.2.1.1.3.0"     # sysUpTimeInstance

      # 인터페이스 카운터 테이블 (IF-MIB::ifXTable, 64-bit HC 카운터)
      [[inputs.snmp.table]]
        name = "snmp_interface"
        index_as_tag = true
        [[inputs.snmp.table.field]]
          name = "ifName"
          oid = "1.3.6.1.2.1.31.1.1.1.1"   # ifName
          is_tag = true
        [[inputs.snmp.table.field]]
          name = "ifHCInOctets"
          oid = "1.3.6.1.2.1.31.1.1.1.6"
        [[inputs.snmp.table.field]]
          name = "ifHCOutOctets"
          oid = "1.3.6.1.2.1.31.1.1.1.10"
        [[inputs.snmp.table.field]]
          name = "ifInErrors"
          oid = "1.3.6.1.2.1.2.2.1.14"     # ifInErrors (광모듈/링크 품질 신호)
        [[inputs.snmp.table.field]]
          name = "ifOutErrors"
          oid = "1.3.6.1.2.1.2.2.1.20"
        [[inputs.snmp.table.field]]
          name = "ifOperStatus"
          oid = "1.3.6.1.2.1.2.2.1.8"      # 1=up 2=down
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegraf-snmp
  namespace: network-observability
  labels: { app: telegraf-snmp, component: observability }
spec:
  replicas: 1
  selector:
    matchLabels: { app: telegraf-snmp }
  template:
    metadata:
      labels: { app: telegraf-snmp, component: observability }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9273"
    spec:
      containers:
        - name: telegraf
          image: telegraf:1.30-alpine          # 공식 이미지(핀). 에어갭은 미러로 교체.
          args: ["--config", "/etc/telegraf/telegraf.conf"]
          env:
            # 콤마 구분 SNMP 타깃. 예: "udp://10.0.0.1:161,udp://10.0.0.2:161"
            - { name: SNMP_AGENTS,    value: "udp://10.0.0.1:161" }
            - name: SNMP_COMMUNITY
              valueFrom:
                secretKeyRef: { name: telegraf-snmp-secret, key: community, optional: true }
          ports:
            - { name: metrics, containerPort: 9273 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/telegraf }
      volumes:
        - name: config
          configMap: { name: telegraf-snmp-config }
---
apiVersion: v1
kind: Service
metadata:
  name: telegraf-snmp
  namespace: network-observability
  labels: { app: telegraf-snmp, component: observability }
spec:
  selector: { app: telegraf-snmp }
  ports:
    - { name: metrics, port: 9273, targetPort: 9273 }
