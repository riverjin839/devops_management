apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 네트워크 옵저버빌리티 수집 스택 (SNMP / gNMI 텔레메트리 / BMP)
# - telegraf-snmp     : SNMP 폴링 → Prometheus(:9273)
# - gnmic-telemetry   : gNMI/OpenConfig 스트리밍 → Prometheus(:9804)
# - openbmp-collector : BMP(TCP 5000) → Kafka(9092) 라우팅 모니터링 파이프라인
resources:
  - namespace.yaml
  - telegraf-snmp.yaml
  - gnmic-telemetry.yaml
  - openbmp-collector.yaml
# pep-collector-cronjob.yaml 은 여기 넣지 않는다 — namespace(monitoring)와 PEP 주소·클러스터
# 이름이 환경마다 달라 그대로 apply 하면 안 되고, push 모드 클러스터에서만 필요하다.
# 배포법은 docs/OBSERVABILITY_GUIDE.md §1-2 참고:
#   kubectl apply -f k8s/base/observability/pep-collector-cronjob.yaml
