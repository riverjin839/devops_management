apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    scrape_configs:
      # ── Prometheus self-monitoring ──────────────────
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # ── kube-state-metrics ─────────────────────────
      # Provides: kube_pod_*, kube_node_*, kube_deployment_*, etc.
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics:8080']

      # ── node-exporter ──────────────────────────────
      # Provides: node_cpu_*, node_memory_*, node_disk_*, node_filesystem_*
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: []
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoints_name]
            regex: node-exporter
            action: keep

      # ── kubelet / cAdvisor ─────────────────────────
      # Provides: container_cpu_*, container_memory_*, container_network_*
      - job_name: 'kubelet'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      - job_name: 'cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
        metrics_path: /metrics/cadvisor

      # ── kubelet volume metrics ─────────────────────
      # Provides: kubelet_volume_stats_* (PVC usage)
      - job_name: 'kubelet-resource'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        metrics_path: /metrics/resource

      # ── 네트워크 옵저버빌리티 수집기 (k8s/base/observability) ──────────────
      # Telegraf SNMP 수집기 → ifHCIn/OutOctets, ifIn/OutErrors, ifOperStatus
      - job_name: 'telegraf-snmp'
        static_configs:
          - targets: ['telegraf-snmp.network-observability.svc:9273']
      # gNMIc gNMI/OpenConfig 텔레메트리
      - job_name: 'gnmic-telemetry'
        static_configs:
          - targets: ['gnmic.network-observability.svc:9804']

      # ── 체감 품질(blackbox ICMP) — 멀티타깃 /probe 패턴 ────────────────────
      # 측정 대상 IP 는 targets 에 채움. 지연=probe_icmp_duration_seconds, 손실=1-probe_success.
      - job_name: 'blackbox-icmp'
        metrics_path: /probe
        params:
          module: [icmp]
        static_configs:
          - targets: ['10.0.0.1', '10.0.0.2']   # 게이트웨이/코어 스위치 등으로 교체
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115
