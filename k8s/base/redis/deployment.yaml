apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: k8s-monitor
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: k8s-daily-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: k8s-daily-monitor
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - "320mb"
            # allkeys-lru 는 메모리 압박 시 Celery 브로커 큐 키(대기 중인 태스크)까지
            # LRU 대상으로 삼아 예약 점검/배치잡이 소리 없이 사라질 수 있다. 이 Redis 는
            # 캐시 전용이 아니라 Celery 브로커+결과백엔드를 겸하므로 noeviction 으로
            # 바꿔 메모리 초과 시 evict 대신 write 실패(명시적 에러)로 드러나게 한다.
            - --maxmemory-policy
            - "noeviction"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
            limits:
              # maxmemory(320mb)보다 여유를 둬 redis 프로세스 자체 오버헤드(클라이언트
              # 버퍼/AOF 등)로 컨테이너가 OOMKill 되기 전에 redis 자체 정책이 먼저 작동하게 함.
              memory: "384Mi"
              cpu: "200m"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: redis-data
          emptyDir: {}
