name: CD - Kubernetes Deployment

# 이 워크플로는 이미지를 빌드하지 않는다. release.yml 이 만든 **숫자 버전 태그(X.Y.Z)** 이미지를 배포만 한다.
# 배포 이미지 태그는 항상 `1.86.0` 같은 SemVer 숫자여야 한다 — SHA(`4b54f85`)·`main`·`latest` 는 배포에 쓰지 않는다
# (아래 validate-version 잡이 형식이 다르면 실패시킨다).
#
# 호출 경로
#   1) 자동: release.yml 이 이미지(:X.Y.Z)를 푸시한 직후 `uses: ./.github/workflows/cd.yml` 로 dev 배포를 호출한다.
#   2) 수동: Actions 탭에서 이 워크플로를 직접 실행 — environment(dev|prod) 와 version(예: 1.86.0) 을 입력한다.
#      prod 배포나 이전 버전으로의 롤백도 이 경로로 한다(해당 버전 이미지가 GHCR 에 이미 있어야 한다).
#
# 예전에는 main push 마다 이 파일이 :<sha>/:main 이미지를 빌드해 SHA 로 배포했고, 병합 직후 auto-release 의
# 릴리스 커밋이 같은 빌드를 한 번 더 일으켰다. 빌드는 release.yml 한 곳으로 모았다.

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (dev|prod)'
        required: true
        type: string
      version:
        description: 'Image version tag — numeric X.Y.Z (예: 1.86.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      version:
        description: 'Image version tag — numeric X.Y.Z (예: 1.86.0)'
        required: true
        type: string

# 같은 환경으로의 배포는 한 줄로 — 연달아 릴리스돼도 kubectl apply 가 서로 덮어쓰지 않게 한다.
concurrency:
  group: cd-deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Require numeric version tag (X.Y.Z)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version 은 숫자 형식(예: 1.86.0)이어야 한다 — 받은 값: '$VERSION'. SHA·main·latest 태그로는 배포하지 않는다."
            exit 1
          fi
          echo "Deploying image tag: $VERSION"

  deploy-dev:
    needs: validate-version
    runs-on: ubuntu-latest
    if: inputs.environment == 'dev'
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check kubeconfig secret availability
        id: check-secret
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG_DEV }}
        run: |
          if [ -z "$KUBECONFIG_SECRET" ]; then
            echo "⚠️  KUBECONFIG_DEV secret is not configured."
            echo "   To enable Kubernetes deployment, add the KUBECONFIG_DEV secret to the"
            echo "   'dev' environment in: Settings → Environments → dev → Secrets."
            echo "   The value must be the base64-encoded kubeconfig YAML:"
            echo "     cat ~/.kube/config | base64 -w0"
            echo "has_kubeconfig=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_kubeconfig=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup kubectl
        if: steps.check-secret.outputs.has_kubeconfig == 'true'
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Setup Kustomize
        if: steps.check-secret.outputs.has_kubeconfig == 'true'
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.3.0'

      - name: Configure kubectl
        if: steps.check-secret.outputs.has_kubeconfig == 'true'
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG_DEV }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_SECRET" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info

      - name: Update image tags in kustomization
        if: steps.check-secret.outputs.has_kubeconfig == 'true'
        working-directory: deploy/k8s/overlays/dev
        env:
          VERSION: ${{ inputs.version }}
        run: |
          kustomize edit set image \
            k8s-daily-monitor/backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${VERSION} \
            k8s-daily-monitor/frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${VERSION}

      - name: Deploy to Dev Kubernetes
        if: steps.check-secret.outputs.has_kubeconfig == 'true'
        run: |
          kustomize build deploy/k8s/overlays/dev | kubectl apply -f -

      - name: Wait for deployment rollout
        if: steps.check-secret.outputs.has_kubeconfig == 'true'
        run: |
          kubectl rollout status deployment/dev-backend -n k8s-monitor-dev --timeout=300s
          kubectl rollout status deployment/dev-frontend -n k8s-monitor-dev --timeout=300s
          kubectl rollout status deployment/dev-celery-worker -n k8s-monitor-dev --timeout=300s
          kubectl rollout status deployment/dev-celery-beat -n k8s-monitor-dev --timeout=300s

      - name: Verify deployment
        if: steps.check-secret.outputs.has_kubeconfig == 'true'
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployments -n k8s-monitor-dev
          echo ""
          echo "=== Pod Status ==="
          kubectl get pods -n k8s-monitor-dev
          echo ""
          echo "=== Services ==="
          kubectl get services -n k8s-monitor-dev

  deploy-prod:
    needs: validate-version
    runs-on: ubuntu-latest
    if: inputs.environment == 'prod'
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check kubeconfig secret availability
        id: check-secret
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG_PROD }}
        run: |
          if [ -z "$KUBECONFIG_SECRET" ]; then
            echo "⚠️  KUBECONFIG_PROD secret is not configured."
            echo "   To enable Kubernetes deployment, add the KUBECONFIG_PROD secret to the"
            echo "   'prod' environment in: Settings → Environments → prod → Secrets."
            echo "   The value must be the base64-encoded kubeconfig YAML:"
            echo "     cat ~/.kube/config | base64 -w0"
            echo "has_kubeconfig=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_kubeconfig=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup kubectl
        if: steps.check-secret.outputs.has_kubeconfig == 'true'
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Setup Kustomize
        if: steps.check-secret.outputs.has_kubeconfig == 'true'
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.3.0'

      - name: Configure kubectl
        if: steps.check-secret.outputs.has_kubeconfig == 'true'
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG_PROD }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_SECRET" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info

      - name: Update image tags in kustomization
        if: steps.check-secret.outputs.has_kubeconfig == 'true'
        working-directory: deploy/k8s/overlays/prod
        env:
          VERSION: ${{ inputs.version }}
        run: |
          kustomize edit set image \
            k8s-daily-monitor/backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${VERSION} \
            k8s-daily-monitor/frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${VERSION}

      - name: Deploy to Prod Kubernetes
        if: steps.check-secret.outputs.has_kubeconfig == 'true'
        run: |
          kustomize build deploy/k8s/overlays/prod | kubectl apply -f -

      - name: Wait for deployment rollout
        if: steps.check-secret.outputs.has_kubeconfig == 'true'
        run: |
          kubectl rollout status deployment/prod-backend -n k8s-monitor-prod --timeout=300s
          kubectl rollout status deployment/prod-frontend -n k8s-monitor-prod --timeout=300s
          kubectl rollout status deployment/prod-celery-worker -n k8s-monitor-prod --timeout=300s
          kubectl rollout status deployment/prod-celery-beat -n k8s-monitor-prod --timeout=300s

      - name: Verify deployment
        if: steps.check-secret.outputs.has_kubeconfig == 'true'
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployments -n k8s-monitor-prod
          echo ""
          echo "=== Pod Status ==="
          kubectl get pods -n k8s-monitor-prod
          echo ""
          echo "=== Services ==="
          kubectl get services -n k8s-monitor-prod

      - name: Post deployment notification
        if: steps.check-secret.outputs.has_kubeconfig == 'true' && success()
        run: |
          echo "Production deployment completed successfully!"
          echo "Image tag: ${{ inputs.version }}"
