name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # 문서-코드 동기화 검사 (docs guard)
  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docs sync check
        run: python3 scripts/docs/check_docs_sync.py

      # feat/fix 성격의 코드 변경 PR 인데 CHANGELOG/문서를 하나도 안 건드리면 실패.
      # 의도된 예외는 PR 제목에 [skip-docs] 를 붙인다 (예: 리팩토링-only, 실험 브랜치).
      - name: Changelog / docs updated check (PR only)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$PR_TITLE" in
            *"[skip-docs]"*) echo "skip-docs 태그 — 검사 생략"; exit 0 ;;
          esac
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "$CHANGED"
          if ! echo "$CHANGED" | grep -qE '^(backend/app/|frontend/src/)'; then
            echo "앱 코드 변경 없음 — 검사 생략"; exit 0
          fi
          if echo "$PR_TITLE" | grep -qE '^(feat|fix)(\(|:|!)'; then
            if ! echo "$CHANGED" | grep -qE '^(CHANGELOG\.md|docs/|CLAUDE\.md|CODE_MAP\.md|README\.md|DESIGN_SYSTEM\.md)'; then
              echo "::error::feat/fix PR 인데 CHANGELOG.md 나 문서(docs/, CLAUDE.md, CODE_MAP.md, README.md) 갱신이 없습니다."
              echo "::error::CHANGELOG.md [Unreleased] 에 항목을 추가하고, 구조가 바뀌었으면 해당 문서도 갱신하세요. 의도적 예외는 PR 제목에 [skip-docs]."
              exit 1
            fi
          fi

  # Frontend 테스트
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # Backend 테스트
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        # pgvector/pgvector:pg15 == postgres:15 + pgvector extension precompiled.
        # work_items/work_guides.embedding (Vector 컬럼) 은 CREATE EXTENSION vector 가
        # 성공해야 테이블 자체가 생성되므로, plain postgres:15 로는 CI 가 실패한다.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: k8s_monitor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/k8s_monitor_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest -v
