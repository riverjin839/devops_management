name: Release

# v* 태그가 push 되면 자동 실행:
#   1) GHCR 이미지 빌드 + 버전 태깅(:X.Y.Z, :X.Y, :latest)
#   2) CHANGELOG 해당 섹션을 본문으로 GitHub Release 생성
#   3) dev 배포 — cd.yml 을 호출해 방금 푸시한 **숫자 버전 태그(:X.Y.Z)** 로 배포한다(SHA 태그 배포 없음)
#   4) 오래된 미태그 이미지 정리
# 이미지 빌드는 이 워크플로 한 곳뿐이다(cd.yml 은 배포 전용 — main push 로 :<sha>/:main 을 만들지 않는다).
# 수동 릴리스 단계(이미지 태깅/Release 작성)를 없애기 위한 자동화. 태그만 올리면 끝.
#
# auto-release.yml 이 태그를 push 한 직후 `gh workflow run release.yml -f tag=vX.Y.Z` 로
# 이 워크플로우를 직접 체이닝한다(기본 GITHUB_TOKEN 으로도 가능 — recursive-trigger 제한은
# push/PR 같은 "이벤트" 재발생에만 적용되고 workflow_dispatch API 명시 호출은 막지 않는다).
# `workflow_dispatch` 입력은 그 체이닝 경로 + "태그는 있는데 릴리즈가 안 만들어졌을 때"의
# 수동 백필 용도 둘 다를 겸한다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리즈할 기존 태그 (예: v1.37.2) — 자동 트리거를 놓친 태그의 수동 백필용'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.reltag.outputs.tag }}
      version: ${{ steps.reltag.outputs.version }}

    steps:
      # workflow_dispatch 로 실행되면 github.ref_name 이 태그가 아니라 dispatch 시 선택한
      # 브랜치(main)라 docker/metadata-action 의 type=semver 가 버전을 못 뽑는다 — 두 트리거
      # 모두에서 동일하게 동작하도록 태그 문자열을 직접 계산해 raw 값으로 넘긴다.
      - name: Resolve release tag
        id: reltag
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major_minor=$(echo "$VERSION" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.reltag.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=raw,value=${{ steps.reltag.outputs.version }}
            type=raw,value=${{ steps.reltag.outputs.major_minor }}
            type=raw,value=latest,enable=${{ !contains(steps.reltag.outputs.tag, '-') }}

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=raw,value=${{ steps.reltag.outputs.version }}
            type=raw,value=${{ steps.reltag.outputs.major_minor }}
            type=raw,value=latest,enable=${{ !contains(steps.reltag.outputs.tag, '-') }}

      - name: Copy CHANGELOG for backend image
        # backend/app/routers/release_notes.py 가 이미지 안에서 CHANGELOG.md 를 읽어
        # 릴리즈 노트 API 를 서빙한다 — backend 이미지를 빌드하는 유일한 워크플로라 여기서 복사한다.
        run: cp CHANGELOG.md backend/CHANGELOG.md

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-push.outputs.tag }}

      - name: Extract CHANGELOG section for this tag
        id: notes
        env:
          REF_TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          VERSION="${REF_TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # CHANGELOG.md 에서 "## [VERSION]" 섹션만 추출 → RELEASE_NOTES.md
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {f=1; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "CHANGELOG 에 [$VERSION] 섹션이 없어 자동 생성 노트를 사용합니다." > RELEASE_NOTES.md
            echo "auto_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "auto_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          EXTRA=""
          if [ "${{ steps.notes.outputs.auto_notes }}" = "true" ]; then
            EXTRA="--generate-notes"
          fi
          if gh release view "$REF_TAG" >/dev/null 2>&1; then
            echo "Release $REF_TAG 이미 존재 — 노트만 갱신"
            gh release edit "$REF_TAG" \
              --title "$REF_TAG" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$REF_TAG" \
              --title "$REF_TAG" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag \
              $EXTRA
          fi

  deploy-dev:
    # 정식 릴리스(vX.Y.Z)만 배포한다. 프리릴리스 태그(vX.Y.Z-rc1 등)는 숫자 형식이 아니라 제외.
    if: ${{ !contains(needs.build-and-push.outputs.tag, '-') }}
    needs: build-and-push
    uses: ./.github/workflows/cd.yml
    with:
      environment: dev
      version: ${{ needs.build-and-push.outputs.version }}
    secrets: inherit

  cleanup-old-images:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: 오래된 컨테이너 이미지 자동 청소 (Backend / Frontend)
        uses: actions/github-script@v7
        with:
          script: |
            const KEEP = 5;
            const owner = context.repo.owner;
            const packages = [
              `${context.repo.repo}/backend`,
              `${context.repo.repo}/frontend`,
            ];

            // org 여부 확인 (org vs 개인 계정 API 엔드포인트 분기)
            let isOrg = false;
            try {
              await github.rest.orgs.get({ org: owner });
              isOrg = true;
            } catch (_) {}

            for (const pkg of packages) {
              let versions;
              try {
                versions = isOrg
                  ? await github.paginate(
                      github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg,
                      { package_type: 'container', package_name: pkg, org: owner }
                    )
                  : await github.paginate(
                      github.rest.packages.getAllPackageVersionsForPackageOwnedByUser,
                      { package_type: 'container', package_name: pkg, username: owner }
                    );
              } catch (e) {
                core.warning(`${pkg} 버전 목록 조회 실패: ${e.message}`);
                continue;
              }

              // 태그 없는 버전만, 최신순 정렬 후 KEEP개 초과분 삭제
              const untagged = versions
                .filter(v => v.metadata?.container?.tags?.length === 0)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              const toDelete = untagged.slice(KEEP);
              core.info(`[${pkg}] 미태그 버전 ${untagged.length}개 중 ${toDelete.length}개 삭제`);

              for (const v of toDelete) {
                try {
                  if (isOrg) {
                    await github.rest.packages.deletePackageVersionForOrg({
                      package_type: 'container', package_name: pkg,
                      org: owner, package_version_id: v.id,
                    });
                  } else {
                    await github.rest.packages.deletePackageVersionForUser({
                      package_type: 'container', package_name: pkg,
                      username: owner, package_version_id: v.id,
                    });
                  }
                  core.info(`  삭제 완료: ${v.name} (id: ${v.id})`);
                } catch (e) {
                  core.warning(`  삭제 실패 ${v.id}: ${e.message}`);
                }
              }
            }
