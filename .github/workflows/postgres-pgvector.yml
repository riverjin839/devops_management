name: Build Postgres + pgvector image

# Postgres 15(Alpine) + pgvector 확장 이미지를 이 저장소의 앱 이미지와 동일한 GHCR
# 네임스페이스(ghcr.io/<owner>/<repo>/postgres-pgvector)에 빌드/게시한다.
# 자주 바뀌지 않는 이미지라 push 트리거는 Dockerfile 변경 시로 한정하고, 필요할 때
# workflow_dispatch 로 수동 재빌드도 가능하게 한다.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docker/postgres-pgvector/**'
      - '.github/workflows/postgres-pgvector.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/postgres-pgvector

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=pg15
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: docker/postgres-pgvector
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
