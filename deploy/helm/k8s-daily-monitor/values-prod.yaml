# ============================================
# Phase 3: 운영 환경 (ArgoCD로 배포)
# ============================================

global:
  imageRegistry: ""  # CI에서 주입
  # imagePullSecrets:
  #   - name: registry-secret

config:
  debug: "false"
  checkIntervalMinutes: "5"
  checkTimeoutSeconds: "30"

secrets:
  databasePassword: "CHANGE_ME_IN_PRODUCTION"
  secretKey: "CHANGE_ME_IN_PRODUCTION"

backend:
  replicaCount: 2
  image:
    tag: ""  # CI에서 주입

frontend:
  replicaCount: 2
  image:
    tag: ""  # CI에서 주입

celery:
  worker:
    replicaCount: 2

# 운영망은 사내 LLM 서비스(OpenAI-호환)를 배선하고 인클러스터 Ollama 는 기본 꺼짐 —
# 켜려면 ollama.enabled=true 로 오버라이드(GPU/리소스 예산 확인 후). 프로필/라우팅은
# 배포 후 Settings → AI/LLM 탭에서 등록(민감정보라 values 에 두지 않는다).
ollama:
  enabled: false

ingress:
  enabled: true
  host: k8s-monitor.company.internal

hpa:
  enabled: true

nodePort:
  enabled: false
