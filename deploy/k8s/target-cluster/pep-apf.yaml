# PEP 조회 트래픽 전용 APF(API Priority and Fairness) — **PEP 가 조회하는 "대상" 클러스터에** 적용한다.
# (PEP 자체 배포용 kustomize overlay 에는 포함하지 않는다. 가이드: docs/K8S_APISERVER_PROTECTION.md)
#
# 효과: PEP 가 폭주해도 PEP 요청은 전용 우선순위 레벨(pep-portal) 안에서만 줄을 서고 거절되며,
#       컨트롤러·스케줄러·kubelet·다른 워크로드 SA 의 apiserver 동시성 몫을 잠식하지 못한다.
#
# 적용 전 바꿀 것: FlowSchema subjects 를 PEP 가 쓰는 kubeconfig 의 실제 주체로.
#   - ServiceAccount 토큰이면 kind: ServiceAccount (name/namespace)
#   - 인증서/OIDC 사용자면 kind: User (name = 인증서 CN 또는 OIDC username)
# API 버전: K8s 1.29+ = flowcontrol.apiserver.k8s.io/v1, 1.26~1.28 = v1beta3 (apiVersion 만 바꿔 적용)
apiVersion: flowcontrol.apiserver.k8s.io/v1
kind: PriorityLevelConfiguration
metadata:
  name: pep-portal
  labels:
    app.kubernetes.io/part-of: pep
spec:
  type: Limited
  limited:
    # 서버 전체 동시성 중 PEP 몫(상대 비율). 기본 workload-low 가 100, global-default 20 수준 —
    # 조회 전용 포털은 10~20 이면 충분하다. 운영하며 거절 지표를 보고 조정.
    nominalConcurrencyShares: 10
    # 다른 레벨에 몫을 빌려주지 않음/빌리지 않음 — PEP 몫을 고정(예측 가능성 우선)
    lendablePercent: 0
    borrowingLimitPercent: 0
    limitResponse:
      type: Queue
      queuing:
        queues: 16
        handSize: 4
        queueLengthLimit: 50
---
apiVersion: flowcontrol.apiserver.k8s.io/v1
kind: FlowSchema
metadata:
  name: pep-portal
  labels:
    app.kubernetes.io/part-of: pep
spec:
  priorityLevelConfiguration:
    name: pep-portal
  # 내장 service-accounts(9000)·global-default(9900) 보다 먼저 매칭되도록 더 작은 값.
  # 시스템 스키마(exempt 1 ~ kube-system-service-accounts 900)보다는 뒤라 시스템 트래픽을 가로채지 않는다.
  matchingPrecedence: 1000
  distinguisherMethod:
    type: ByUser
  rules:
    - subjects:
        - kind: ServiceAccount
          serviceAccount:
            name: pep-reader          # ← PEP kubeconfig 의 SA 이름으로 변경
            namespace: pep-system     # ← SA 네임스페이스로 변경
      resourceRules:
        - verbs: ["*"]
          apiGroups: ["*"]
          resources: ["*"]
          clusterScope: true
          namespaces: ["*"]
      nonResourceRules:
        - verbs: ["*"]
          nonResourceURLs: ["*"]
