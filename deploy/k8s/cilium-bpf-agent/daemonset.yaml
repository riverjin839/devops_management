# PEP Cilium 데이터패스 에이전트(pep-bpf-agent) DaemonSet — 화면 「에이전트 설치」 매니페스트와 같은 내용이다
# (backend/app/services/cilium_datapath/manifest.py 가 원천, 테스트가 일치를 검사한다).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cilium-bpf-agent
  namespace: "k8s-monitor-agent"
  labels:
    app.kubernetes.io/name: cilium-bpf-agent
    app.kubernetes.io/part-of: k8s-daily-monitor
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cilium-bpf-agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cilium-bpf-agent
    spec:
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: "ghcr.io/riverjin839/devops_management/bpf-agent:latest"
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          envFrom:
            - secretRef:
                name: cilium-bpf-agent-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["BPF"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
              mountPropagation: HostToContainer
              readOnly: true
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: Directory
