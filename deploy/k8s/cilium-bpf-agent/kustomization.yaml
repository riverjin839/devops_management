# Cilium 데이터패스 에이전트(pep-bpf-agent) — 대상 클러스터마다 설치한다(노드마다 1개, CAP_BPF 만 가진 DaemonSet).
# 사용법은 README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: k8s-monitor-agent
resources:
  - namespace.yaml
  - daemonset.yaml
  # secret.yaml 은 secret.yaml.tmpl 에서 복사해 값을 채운 뒤 추가하세요.
  # - secret.yaml
