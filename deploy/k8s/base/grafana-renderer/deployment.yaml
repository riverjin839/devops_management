apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-renderer
  namespace: k8s-monitor
  labels:
    app: grafana-renderer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-renderer
  template:
    metadata:
      labels:
        app: grafana-renderer
    spec:
      securityContext:
        # Chromium(headless) 실행에 필요한 최소 권한
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana-renderer
          image: grafana/grafana-image-renderer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: ENABLE_METRICS
              value: "true"
            - name: HTTP_PORT
              value: "8081"
            - name: RENDERING_MODE
              value: "clustered"
            - name: RENDERING_CLUSTERING_MODE
              value: "browser"
            - name: RENDERING_CLUSTERING_MAX_CONCURRENCY
              value: "5"
          readinessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
