# LLM 전용 Celery 워커(celery-worker-llm) 의 읽기 전용 ServiceAccount.
#
# 자동 장애 분석은 "분석 전용 — 조치 권한 없음" 이 설계 불변 조건이다(docs/AIRGAP_LLM_ARCHITECTURE.md §0·§3.2).
# 코드 쪽 보증(tests/test_no_execution_guard.py)과 별개로, 권한 차원에서도 변경이 불가능하게
# backend 공용 SA(k8s-monitor-sa — pods/exec·pods create/delete·events create 포함)와 분리한다.
# 여기에는 분석 컨텍스트 수집(로그·describe·이벤트)에 필요한 get/list/watch 만 둔다.
#
# 주의: 등록 클러스터를 kubeconfig(DB 저장)로 조회하는 경우에는 그 kubeconfig 의 권한이 쓰인다 —
# 이 SA 는 in-cluster(자기 클러스터) 조회의 권한 상한이다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-monitor-llm-sa
  namespace: k8s-monitor
  labels:
    app.kubernetes.io/name: k8s-daily-monitor
    app.kubernetes.io/component: llm-worker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-monitor-llm-reader
  labels:
    app.kubernetes.io/name: k8s-daily-monitor
    app.kubernetes.io/component: llm-worker
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - endpoints
      - namespaces
      - events
      - persistentvolumeclaims
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - pods/log
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources:
      - events
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-monitor-llm-reader-binding
  labels:
    app.kubernetes.io/name: k8s-daily-monitor
    app.kubernetes.io/component: llm-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-monitor-llm-reader
subjects:
  - kind: ServiceAccount
    name: k8s-monitor-llm-sa
    namespace: k8s-monitor
