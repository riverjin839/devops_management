---
# blackbox-exporter — 체감 품질(능동 프로브): ICMP 지연(latency) + 성공/실패(loss), TCP 연결성.
# 멀티타깃 패턴: Prometheus 가 ?target=<ip>&module=icmp 로 /probe 호출 → probe_* 지표 수집.
# 지터(jitter)는 probe_icmp_duration_seconds 의 표준편차로 PrometheusRule 에서 파생(아래 rules 파일).
# ICMP 송신에는 CAP_NET_RAW 가 필요.
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
  labels: { app: blackbox-exporter, component: monitoring }
data:
  blackbox.yml: |
    modules:
      icmp:
        prober: icmp
        timeout: 5s
        icmp:
          preferred_ip_protocol: ip4
      tcp_connect:
        prober: tcp
        timeout: 5s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  labels: { app: blackbox-exporter, component: monitoring }
spec:
  replicas: 1
  selector:
    matchLabels: { app: blackbox-exporter }
  template:
    metadata:
      labels: { app: blackbox-exporter, component: monitoring }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9115"
    spec:
      containers:
        - name: blackbox-exporter
          image: prom/blackbox-exporter:v0.25.0    # 공식 이미지(핀)
          args: ["--config.file=/etc/blackbox/blackbox.yml"]
          ports:
            - { name: http, containerPort: 9115 }
          securityContext:
            capabilities:
              add: ["NET_RAW"]      # ICMP 프로브용
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/blackbox }
      volumes:
        - name: config
          configMap: { name: blackbox-exporter-config }
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  labels: { app: blackbox-exporter, component: monitoring }
spec:
  selector: { app: blackbox-exporter }
  ports:
    - { name: http, port: 9115, targetPort: 9115 }
