# ============================================
# Phase 2: 폐쇄망 환경
# 사용: helm install k8s-monitor ./helm/k8s-daily-monitor -f ./helm/k8s-daily-monitor/values-airgap.yaml
# ============================================

# -- 폐쇄망 Private Registry (실제 주소로 변경)
global:
  imageRegistry: "10.61.162.101:5000"
  # imagePullSecrets:
  #   - name: registry-secret

config:
  debug: "true"
  checkIntervalMinutes: "5"

secrets:
  databasePassword: "postgres"
  secretKey: "airgap-secret-key-change-this"

backend:
  replicaCount: 1
  image:
    repository: k8s-monitor/backend

frontend:
  replicaCount: 1
  image:
    repository: k8s-monitor/frontend

postgresql:
  image:
    repository: library/postgres

redis:
  image:
    repository: library/redis

celery:
  worker:
    replicaCount: 1

monitoring:
  enabled: true
  prometheus:
    image:
      repository: prom/prometheus
  grafana:
    image:
      repository: grafana/grafana
  kubeStateMetrics:
    image:
      repository: kube-state-metrics/kube-state-metrics
  nodeExporter:
    image:
      repository: prom/node-exporter

ollama:
  # 폐쇄망: bake-in된 모델명과 일치해야 함 (ollama list 로 확인)
  model: "qwen2.5-coder:7b"
  url: "http://ollama:11434"
  image:
    # 상대 경로만 지정 — global.imageRegistry(위) 가 k8s-daily-monitor.image 헬퍼를
    # 통해 자동으로 접두된다("10.61.162.101:5000/ollama-qwen2.5-coder"). 여기 직접
    # 레지스트리 주소를 박으면 이중 접두(registry/registry/repo)가 된다.
    # scripts/deploy-airgap.sh 로 이 이미지를 내부 레지스트리에 미러링해야 한다.
    repository: ollama-qwen2.5-coder
    tag: "7b"
    pullPolicy: IfNotPresent
  # 폐쇄망은 재반입이 비싸므로 모델 볼륨을 영속화 — 재시작해도 추가 pull 한 모델 유지.
  persistence:
    enabled: true
    size: 20Gi

ingress:
  enabled: false

hpa:
  enabled: false

nodePort:
  enabled: true
  frontend: 30080
  backend: 30800
  prometheus: 30090
  grafana: 30030
