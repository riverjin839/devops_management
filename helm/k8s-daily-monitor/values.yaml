# ============================================
# K8s Daily Monitor - Helm Values
# ============================================

# -- 글로벌 설정
global:
  # -- 컨테이너 이미지 레지스트리
  imageRegistry: ""
  # -- 이미지 Pull Secret (private registry용)
  imagePullSecrets: []

# -- 앱 설정
config:
  appName: "K8s Daily Monitor"
  debug: "false"
  checkIntervalMinutes: "5"
  checkTimeoutSeconds: "30"
  ansiblePlaybookDir: "/app/ansible/playbooks"
  ansibleInventoryDir: "/app/ansible/inventory"

# -- Secret 설정
secrets:
  databaseUser: "postgres"
  databasePassword: "changeme-in-production"
  secretKey: "your-super-secret-key-change-this-in-production"

# ============================================
# Backend (FastAPI)
# ============================================
backend:
  replicaCount: 2
  image:
    repository: k8s-daily-monitor/backend
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8000
  resources:
    # 대규모 클러스터 수집 시 k8s API 역직렬화 피크 고려 — 512Mi 는 OOMKilled 이력.
    requests:
      memory: "384Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5

# ============================================
# Frontend (Nginx + React)
# ============================================
frontend:
  replicaCount: 2
  image:
    repository: k8s-daily-monitor/frontend
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

# ============================================
# PostgreSQL
# ============================================
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "15-alpine"
  storage:
    size: 10Gi
    storageClassName: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# ============================================
# Redis
# ============================================
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  maxmemory: "256mb"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# ============================================
# Celery
# ============================================
celery:
  worker:
    replicaCount: 2
    concurrency: 2
    resources:
      requests:
        memory: "256Mi"
        cpu: "200m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  # LLM 전용 워커 — `llm` 큐만 소비(알람 자동 분석·임베딩 백필). 기본 워커와 격리해
  # LLM 대기(120s+)가 점검/배치잡을 밀어내지 않게 한다. LLM 부하 상한 = concurrency.
  llmWorker:
    enabled: true
    concurrency: 1
    resources:
      requests:
        memory: "192Mi"
        cpu: "100m"
      limits:
        memory: "384Mi"
        cpu: "300m"
  beat:
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"

# ============================================
# Ingress
# ============================================
ingress:
  enabled: true
  className: nginx
  host: k8s-monitor.local
  annotations: {}

# ============================================
# HPA (Horizontal Pod Autoscaler)
# ============================================
hpa:
  enabled: true
  backend:
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70
  celeryWorker:
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilization: 70
  frontend:
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilization: 70

# ============================================
# RBAC
# ============================================
serviceAccount:
  create: true
  name: k8s-monitor-sa

# ============================================
# Monitoring Stack (Prometheus + Grafana)
# ============================================
monitoring:
  enabled: true
  prometheus:
    image:
      repository: prom/prometheus
      tag: "v2.51.0"
    retention: "15d"
    resources:
      requests:
        memory: "256Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  grafana:
    image:
      repository: grafana/grafana
      tag: "10.4.0"
    adminUser: "admin"
    adminPassword: "admin"
    anonymousAccess: true
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "300m"
  kubeStateMetrics:
    image:
      repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
      tag: "v2.12.0"
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "200m"
  nodeExporter:
    image:
      repository: prom/node-exporter
      tag: "v1.7.0"
    resources:
      requests:
        memory: "32Mi"
        cpu: "25m"
      limits:
        memory: "64Mi"
        cpu: "100m"

# ============================================
# Ollama (인클러스터 자체 LLM — services/llm 게이트웨이의 'ollama' provider)
# Air-gap: set model to match the name baked into your custom image.
# 모델명은 이미지에 pre-baked 된 이름과 반드시 일치해야 한다(ghcr.io/riverjin839/
# devops_management/ollama-qwen2.5-coder:7b → model: "qwen2.5-coder:7b", 빌드는
# .github/workflows/ollama-qwen2.5-coder.yml + docker/ollama-qwen2.5-coder/Dockerfile).
# 사내 LLM 서비스(OpenAI-호환)는 이 블록과 무관하게 Settings → AI/LLM 탭에서 프로필로
# 등록한다(LLM_API_BASE/LLM_API_KEY 는 bootstrap 폴백 — docs/ENVIRONMENT.md).
# ============================================
ollama:
  # false 로 끄면 사내 LLM 프로필만으로 운영 가능(자체 LLM 미배포).
  enabled: true
  model: "qwen2.5-coder:7b"
  url: "http://ollama:11434"
  numParallel: 2
  image:
    repository: ghcr.io/riverjin839/devops_management/ollama-qwen2.5-coder
    tag: "7b"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "4Gi"
      cpu: "2"
    limits:
      memory: "16Gi"
      cpu: "8"
  nodeSelector: {}
  tolerations: []
  # 모델 영속화 — 기본은 이미지에 구운 모델만 사용(꺼짐). true 로 켜면 PVC 를 마운트해
  # 재시작 후에도 추가로 pull 한 모델을 유지한다 (k8s/base/ollama.yaml 의 동일 주석 참고).
  persistence:
    enabled: false
    size: 20Gi
    storageClass: ""

# ============================================
# 사내 LLM 서비스 (OpenAI-호환) — bootstrap 폴백
# 값을 채우면 배포 시 internal-llm 프로필이 자동 합성된다. 운영 중 변경은
# Settings → AI/LLM 탭(AppSetting `llm_settings`)이 원천 — 이 값은 최초 배포용.
# apiKey 는 여기 두는 대신 --set 이나 별도 sealed-secret 으로 주입 권장.
# ============================================
llm:
  apiBase: ""
  apiKey: ""
  model: ""

# ============================================
# Super Pod — Deep Daily Check
# 같은 backend 이미지를 새 엔트리포인트로 띄워, 인증서 만료/etcd 단편화/
# CNI flow/PVC/이미지풀/RBAC 등 deep check 를 수행한다.
# ============================================
deepcheck:
  # -- centralized 모드 CronJob 활성화 (관리 클러스터에서 모든 등록 클러스터 점검)
  enabled: true
  # -- 09:15/13:15/18:15 KST (= UTC 00:15/04:15/09:15)
  schedule: "15 0,4,9 * * *"
  # -- 동일 backend 이미지 재사용
  image:
    repository: ""        # 빈 값이면 backend.image.repository 사용
    tag: ""               # 빈 값이면 backend.image.tag 사용
    pullPolicy: IfNotPresent
  # -- 1회 실행 timeout (초)
  activeDeadlineSeconds: 1200
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  # -- Job 보관 개수
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  # -- Ingest 토큰 (in-cluster 모드 대상 클러스터에서 push 시 사용)
  ingestToken: "change-me-in-production"
  # -- pod_to_pod 체커가 일회용 probe pod 를 띄울 때 사용하는 namespace
  probeNamespace: "devops"
  # -- 알림 채널 기본값. UI 에서 NotificationChannel 로 동적으로도 추가 가능.
  notifications:
    slack:
      webhookUrl: ""
    smtp:
      host: ""
      port: 587
      user: ""
      password: ""
      from: "k8s-monitor@example.com"
      useTLS: true

# ============================================
# NodePort (폐쇄망/개발용)
# ============================================
nodePort:
  enabled: false
  frontend: 30080
  backend: 30800
  prometheus: 30090
  grafana: 30030
