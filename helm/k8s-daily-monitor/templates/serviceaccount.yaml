{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "k8s-daily-monitor.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-cluster-reader
  labels:
    {{- include "k8s-daily-monitor.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services, endpoints, namespaces, componentstatuses, configmaps, persistentvolumes, persistentvolumeclaims, serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # Deep check: kubeadm certs check-expiration / etcdctl 위해 exec / proxy 필요
  - apiGroups: [""]
    resources: [pods/exec, pods/proxy, nodes/proxy]
    verbs: [create, get]
  # pod_to_pod 체커가 일회용 probe pod 를 띄우기 위한 권한
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete]
  # K8sEvent notification channel
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch, list, get, watch]
  - nonResourceURLs: ["/healthz", "/livez", "/readyz", "/healthz/*", "/livez/*", "/readyz/*"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-cluster-reader-binding
  labels:
    {{- include "k8s-daily-monitor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-cluster-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
---
# celery-worker-llm 전용 읽기 전용 SA — 자동 분석은 "분석 전용(조치 권한 없음)" 이라
# 공용 SA 의 exec·pod 생성/삭제·event 생성 권한을 주지 않는다 (deploy/k8s/base/celery/llm-serviceaccount.yaml 과 동일).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.llmName | default "k8s-monitor-llm-sa" }}
  labels:
    {{- include "k8s-daily-monitor.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-llm-reader
  labels:
    {{- include "k8s-daily-monitor.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services, endpoints, namespaces, events, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: ["events.k8s.io"]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-llm-reader-binding
  labels:
    {{- include "k8s-daily-monitor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-llm-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.llmName | default "k8s-monitor-llm-sa" }}
    namespace: {{ .Release.Namespace }}
{{- end }}
